# Every `run:` step below is also run, in order, by `pnpm ci:local`
# (tooling/ci-local.ts), so keep each one a single-line command.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    # Tripwire, not a budget. Healthy runs took 12.8 to 20.6 minutes on
    # 2026-10-23 (runs 39946026969, 39935987092, 39942528522). Run
    # 39944349143 then hit the old 30: the Chromium step's apt fetch
    # pulled 25.9 MB at 44.5 kB/s (9 min 43 s). 45 leaves room for one
    # slow mirror and still stops a hung job.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: std
          POSTGRES_PASSWORD: std
          POSTGRES_DB: std
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U std -d std" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STD_DATABASE_URL: postgres://std:std@127.0.0.1:54329/std
      # The bench smoke test (bench/test/smoke.test.ts) creates and drops its own
      # 50k-record database here; locally it uses the bench container on 54330.
      STD_BENCH_DATABASE_URL: postgres://std:std@127.0.0.1:54329/std
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # check-vendor reads the git-subtree trailers of the vendoring commit;
          # the release-compatibility step reads the previous release's tag.
          fetch-depth: 0
          fetch-tags: true
      # Installs the pnpm version pinned by "packageManager" (pnpm@12.14.0).
      # v6 runs on Node 24 (v4 ran on the deprecated Node 20) and supports
      # pnpm 12 since 6.1.0; like v4 it needs no inputs here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - name: Toolchain versions
        run: test "$(node --version)" = v26.12.0 && test "$(pnpm --version)" = 12.14.0
      - name: Install
        run: pnpm install --frozen-lockfile
      # The quickstart's credential check (and its tests) trace every execve
      # with strace. A no-op outside GitHub Actions: `pnpm ci:local` runs
      # this step too and must not call sudo; locally, install strace yourself
      # (`pnpm quickstart:ci` fails with instructions when it is missing).
      # Prints the version: the parser supports 6.8 (this runner) and 6.19,
      # each tested with a recorded trace (decision 0016).
      - name: strace (for the quickstart's execve trace)
        run: if [ -n "${GITHUB_ACTIONS:-}" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq strace; fi; if command -v strace >/dev/null; then strace -V | head -n 1; fi
      - name: Postgres
        run: pnpm check:postgres
      - name: Lint and format
        run: pnpm check
      - name: Tooling checks (tsconfig profiles, plain imports, lockfile, vendored Effect and Foldkit, requirements matrix)
        run: pnpm check:tooling
      - name: Type check
        run: pnpm typecheck
      # Creates and removes its own Postgres 18 with throwaway TLS certificates.
      - name: Postgres TLS
        run: pnpm test:tls
      - name: Test
        run: pnpm test
      # Chromium for the browser tests, with its system libraries. A no-op
      # outside GitHub Actions: `pnpm ci:local` runs this step too and must not
      # call sudo; locally, install it once into your user cache with
      # `pnpm --filter @std/web exec playwright install chromium` (the browser
      # tests fail with that hint when it is missing).
      - name: Chromium (for the browser tests)
        run: if [ -n "${GITHUB_ACTIONS:-}" ]; then pnpm --filter @std/web exec playwright install --with-deps chromium; fi
      # The web app built and served by a real `std serve` on a disposable
      # database, in Chromium (decision 0018).
      - name: Browser tests (the web app in Chromium against std serve)
        run: pnpm --filter @std/web test:browser
      - name: Toolchain canaries
        run: pnpm test:canaries
      # The Step 1 runnable result: `std upgrade`, `std bootstrap-admin` and
      # `std serve` on a disposable database, then examples/quickstart.sh
      # twice (the rerun must succeed too), each ending with `std doctor`.
      - name: Quickstart (examples/quickstart.sh against std serve, run twice)
        run: pnpm quickstart:ci
      # The Step 3 runnable result: the helpdesk set v3 installed by
      # `std upgrade --set`, then examples/helpdesk/tmf621.sh through TMF621
      # twice with a production worker and the local listener, checking callback
      # receipts and eventId duplicates under the quickstart's execve trace.
      - name: TMF621 example (examples/helpdesk/tmf621.sh against std serve, run twice)
        run: pnpm tmf621-example:ci
      # Release compatibility, a database-upgrade check (decision 0021,
      # decision 56): the previous release's tag
      # (examples/quickstart/src/previous-release.ts) installs and fills a
      # database with its own code and quickstart; this branch upgrades it,
      # `std doctor` must exit 0, and this branch's quickstart runs against
      # this branch's `std serve`. Clients of the old API are not supported.
      - name: Release compatibility (previous release's database upgraded, this branch's quickstart against it)
        run: pnpm release-compat:ci

  # The pinned TMF621 Conformance Test Kit against std serve (Contracts 11.1,
  # decision 0033). `pnpm ctk:ci` starts STD on a disposable database with the
  # helpdesk set v3, checks the kit's payloads against it, and runs the kit
  # (a Docker image) only under GitHub Actions; `pnpm ci:local` runs the
  # payload self-check alone. The reports are the artifact.
  ctk-tmf621:
    runs-on: ubuntu-24.04
    # A tripwire, not a budget: the whole job ran 1m49s on run 39944349143
    # (gh run view: 11:11:34Z to 11:13:23Z, 2026-10-23), so 30 minutes only
    # ever stops a hung kit, server or download.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: std
          POSTGRES_PASSWORD: std
          POSTGRES_DB: std
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U std -d std" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STD_DATABASE_URL: postgres://std:std@127.0.0.1:54329/std
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.12.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TMF621 CTK (the pinned kit against std serve, Contracts 11.1)
        run: pnpm ctk:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ctk-tmf621-reports
          path: ctk-reports/
          if-no-files-found: ignore
