# Every `run:` step below is also run, in order, by `pnpm ci:local`
# (tooling/ci-local.ts), so keep each one a single-line command.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: std
          POSTGRES_PASSWORD: std
          POSTGRES_DB: std
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U std -d std" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STD_DATABASE_URL: postgres://std:std@127.0.0.1:54329/std
      # The bench smoke test (bench/test/smoke.test.ts) creates and drops its own
      # 50k-record database here; locally it uses the bench container on 54330.
      STD_BENCH_DATABASE_URL: postgres://std:std@127.0.0.1:54329/std
    steps:
      - uses: actions/checkout@v5
        with:
          # check-vendor reads the git-subtree trailers of the vendoring commit;
          # the release-compatibility step reads the previous release's tag.
          fetch-depth: 0
          fetch-tags: true
      # Installs the pnpm version pinned by "packageManager" (pnpm@12.14.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.0
          cache: pnpm
      - name: Toolchain versions
        run: test "$(node --version)" = v26.12.0 && test "$(pnpm --version)" = 12.14.0
      - name: Install
        run: pnpm install --frozen-lockfile
      # The quickstart's credential check (and its tests) trace every execve
      # with strace. A no-op outside GitHub Actions: `pnpm ci:local` runs
      # this step too and must not call sudo; locally, install strace yourself
      # (`pnpm quickstart:ci` fails with instructions when it is missing).
      - name: strace (for the quickstart's execve trace)
        run: if [ -n "${GITHUB_ACTIONS:-}" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq strace; fi
      - name: Postgres
        run: pnpm check:postgres
      - name: Lint and format
        run: pnpm check
      - name: Tooling checks (tsconfig profiles, plain imports, lockfile, vendored Effect and Foldkit)
        run: pnpm check:tooling
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Chromium for the browser tests, with its system libraries. A no-op
      # outside GitHub Actions: `pnpm ci:local` runs this step too and must not
      # call sudo; locally, install it once into your user cache with
      # `pnpm --filter @std/web exec playwright install chromium` (the browser
      # tests fail with that hint when it is missing).
      - name: Chromium (for the browser tests)
        run: if [ -n "${GITHUB_ACTIONS:-}" ]; then pnpm --filter @std/web exec playwright install --with-deps chromium; fi
      # The web app built and served by a real `std serve` on a disposable
      # database, in Chromium (decision 0018).
      - name: Browser tests (the web app in Chromium against std serve)
        run: pnpm --filter @std/web test:browser
      - name: Toolchain canaries
        run: pnpm test:canaries
      # The Step 1 runnable result: `std upgrade`, `std bootstrap-admin` and
      # `std serve` on a disposable database, then examples/quickstart.sh
      # twice (the rerun must succeed too), each ending with `std doctor`.
      - name: Quickstart (examples/quickstart.sh against std serve, run twice)
        run: pnpm quickstart:ci
      # Release compatibility: the previous release's tag
      # (examples/quickstart/src/previous-release.ts) installs and fills a
      # database with its own code and quickstart; this branch upgrades it,
      # `std doctor` must exit 0, and that release's quickstart, unchanged,
      # and this branch's run against this branch's `std serve`; then the
      # release's quickstart sets up a fresh install of this branch.
      - name: Release compatibility (previous release's database and quickstart against this branch)
        run: pnpm release-compat:ci
