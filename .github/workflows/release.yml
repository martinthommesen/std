name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign locally without pushing images or charts
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-guard:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject publication from a branch
        run: |
          echo 'Publishing requires a v* tag. Use dry_run=true to build from a branch.' >&2
          exit 1

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ghcr.io/martinthommesen/std
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Prepare deliverables
        run: mkdir -p dist
      - name: Install checksum-pinned tools
        shell: bash
        run: |
          bash docker/release-tools.sh "$RUNNER_TEMP/std-release-tools"
          echo "$RUNNER_TEMP/std-release-tools" >> "$GITHUB_PATH"
      - name: Create builder
        # BuildKit v0.26.3, pinned by OCI index digest as well as version.
        run: docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
      - name: Build server image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Step 3 signs the working server image; Step 5 replaces its packaging.
          file: docker/quickstart.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:dry-run
          push: false
          outputs: type=oci,dest=dist/std-image.tar
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate image SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          syft oci-archive:dist/std-image.tar -o spdx-json=dist/sbom.spdx.json
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image-digest.txt
      - name: Sign dry-run image archive and SBOM
        run: cosign sign-blob --yes --bundle dist/std-image.sigstore.json dist/std-image.tar && cosign sign-blob --yes --bundle dist/sbom.sigstore.json dist/sbom.spdx.json
      # STEP 5 HOOK: automatically enabled when deploy/oda/std/Chart.yaml exists.
      # Sign the exact packaged chart, retain its Sigstore bundle, and push only
      # on a publishing tag. Helm's .prov uses OpenPGP; this uses keyless Sigstore.
      - name: Package and sign Step 5 Helm chart
        id: chart
        if: hashFiles('deploy/oda/std/Chart.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail
          helm dependency build deploy/oda/std
          helm lint deploy/oda/std
          helm package deploy/oda/std --destination dist
          for chart in dist/*.tgz; do
            cosign sign-blob --yes --bundle "$chart.sigstore.json" "$chart"
          done
      - name: Save signed deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ github.run_id }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/martinthommesen/std
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Release gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned tools
        shell: bash
        run: |
          bash docker/release-tools.sh "$RUNNER_TEMP/std-release-tools"
          echo "$RUNNER_TEMP/std-release-tools" >> "$GITHUB_PATH"
      - name: Create builder
        # BuildKit v0.26.3, pinned by OCI index digest as well as version.
        run: docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Step 3 signs the working server image; Step 5 replaces its packaging.
          file: docker/quickstart.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.gate.outputs.tag }}
          push: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate image SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          syft "registry:$IMAGE@$DIGEST" -o spdx-json=dist/sbom.spdx.json
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image-digest.txt
      - name: Sign published image and attach SBOM
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST" && cosign attest --yes --type spdxjson --predicate dist/sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest image SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # STEP 5 HOOK: automatically enabled when deploy/oda/std/Chart.yaml exists.
      # Sign the exact packaged chart, retain its Sigstore bundle, and push only
      # on a publishing tag. Helm's .prov uses OpenPGP; this uses keyless Sigstore.
      - name: Package and sign Step 5 Helm chart
        id: chart
        if: hashFiles('deploy/oda/std/Chart.yaml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          helm dependency build deploy/oda/std
          helm lint deploy/oda/std
          helm package deploy/oda/std --destination dist
          for chart in dist/*.tgz; do
            cosign sign-blob --yes --bundle "$chart.sigstore.json" "$chart"
            printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            helm push "$chart" oci://ghcr.io/martinthommesen/charts
          done
      - name: Retain verification bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: cp "$PROVENANCE" dist/provenance.sigstore.json && cp "$SBOM" dist/sbom-attestation.sigstore.json
      - name: Save signed deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ github.run_id }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
