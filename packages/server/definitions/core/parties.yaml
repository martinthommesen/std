# The party foundation (Contracts 11.3, decision 0024): the parties tickets,
# configuration items and orders name. A party is an individual (a person)
# or an organization. Every user has exactly one individual
# (`core.user.individual`). The TMF632 Party adapter over these classes is
# Step 4; the fields are the ones it maps (TMF632 v5.0.0 user guide,
# "Individual fields" and "Organization fields").
tables:
  - id: 566904e7-72b9-455a-8ea1-5df797c43ae9
    name: core.party
    label: Party
    displayField: name
    helpText: A person or an organization.
    fields:
      - id: 7292e739-5395-415e-a5b6-138c247bad45
        name: name
        type: { kind: text, maxLength: 400 }
        helpText: The name references show. An individual's is filled from its given and family names when a save leaves it empty.
      - id: de47137e-585c-4312-bf76-e96f3b2bcde6
        name: status
        type: choice
        default: initialized
        choices:
          - {
              id: c1977ce8-ce98-4626-a366-2762f1bc3716,
              key: initialized,
              label: Initialized,
            }
          - {
              id: c191ad2e-0172-40d7-a12e-a5ca0dc83d8a,
              key: validated,
              label: Validated,
            }
          - {
              id: 0a9a07a5-8fc8-4ed1-b59e-f642913b25a5,
              key: deceased,
              label: Deceased,
            }
          - {
              id: 3c064328-c859-4077-9e2a-543005f397fb,
              key: closed,
              label: Closed,
            }
      # Value objects STD does not interpret, stored whole (Contracts 11.1,
      # "Embedded arrays"): TMF632 has them on individuals and organizations.
      - id: 2dc5bd4f-5e34-46e0-9fef-38aa5b4ca03c
        name: contact_medium
        type: json
      - id: e72189d7-8440-4d0b-8823-dc99144bee60
        name: external_reference
        type: json
      - id: 4929051b-2330-42c2-a1c1-9d3423c1b09c
        name: party_characteristic
        type: json

  - id: a1d5e868-1a22-4b6e-8a65-605e046f24ab
    name: core.individual
    label: Individual
    extends: core.party
    helpText: A person. Every user has exactly one.
    fields:
      - id: f41d3f02-c469-428e-85cb-c6f55a2902de
        name: given_name
        type: { kind: text, maxLength: 200 }
        required: true
      - id: bd493796-8b5e-4907-9e12-6a047dac62e7
        name: family_name
        type: { kind: text, maxLength: 200 }
        required: true
      - id: 6d6be5f1-2734-467a-b90c-de51fc1694e2
        name: birth_date
        type: date
      - id: b4d781fa-5179-407c-96d7-480ed7a36412
        name: individual_identification
        type: json
    overrides:
      # TMF632 IndividualStateType.
      - id: ceae5106-d685-4ef1-bc40-87cd489c2398
        field: status
        choices: [initialized, validated, deceased]

  - id: f94b83bf-19a4-4793-b06f-d5b4b0727fac
    name: core.organization
    label: Organization
    extends: core.party
    helpText: A company, a department or another group of people.
    fields:
      - id: 0773cefc-558a-4846-86b3-29b188410a1c
        name: trading_name
        type: { kind: text, maxLength: 400 }
      - id: 1d91aec4-e2a1-4dd5-bf69-156a17223d03
        name: is_legal_entity
        type: boolean
      - id: 433d4fe0-c988-46f2-b974-64a76d8a1cd0
        name: organization_type
        type: { kind: text, maxLength: 100 }
      - id: 4bfa5e7e-4c21-48e1-94ba-a5a2b5296a79
        name: exists_from
        type: dateTime
      - id: b6f116a7-9b19-480a-aacb-9a562f7f94a4
        name: exists_until
        type: dateTime
      - id: ec58d8fa-c694-4eda-98c7-e8bd99083830
        name: organization_identification
        type: json
    overrides:
      - id: c3ff8a5d-bd9a-47ff-8ba5-edecc15cd7b7
        field: name
        required: true
      # TMF632 OrganizationStateType.
      - id: 9eea4ea2-74d6-45eb-b94f-773aa3f9160f
        field: status
        choices: [initialized, validated, closed]
