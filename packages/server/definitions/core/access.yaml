# Built-in roles, permissions and access rules (Contracts 3.1, 3.2).
roles:
  - id: 8e67ee7f-106e-48f9-a8ff-b494fd0999e5
    name: admin
    label: Administrator
  - id: 400765a2-d13e-4926-bbf5-b89fd448054c
    name: authenticated
    label: Authenticated user
    helpText: Held implicitly by every active user.
  - id: e5798e3e-7bbb-46e5-94a1-5e94be04c372
    name: schema_purger
    label: Schema purger
    helpText: Holds schema.purge; admins do not.

permissions:
  - id: 482cfac8-dc92-4637-a8cb-ce4eaf01233d
    name: events.subscribe
    label: Register event listeners
  - id: ba9fb2e0-d28d-4f77-aeaf-dab447f3f8a9
    name: schema.purge
    label: Purge retired definitions
  - id: f84a7851-ccdb-4c84-8363-6cf2c1078520
    name: schema.snapshot
    label: Read schema snapshots
  - id: 6de89171-f738-4ade-aa1b-2817f848899c
    name: rules.run_as
    label: Let rules run as another identity

grants:
  - id: da9e139b-7421-4702-8d44-f184b173c1c9
    role: admin
    permission: events.subscribe
  - id: d8ef93f6-07e7-473b-87fa-1add0f89541e
    role: schema_purger
    permission: schema.purge

accessRules:
  - id: be681045-76e4-4c0f-9220-a36ffb180413
    description: Admins may do everything on every table.
    effect: allow
    roles: [admin]
    table: "*"
    target: records
    actions: [read, create, update, delete]
  - id: 3bd8ef4a-4973-4ca2-a041-0bfd67b838e9
    description: Admins may read and write every field.
    effect: allow
    roles: [admin]
    table: "*"
    target: fields
    fields: "*"
    actions: [read, create, update]
  - id: 184c66e4-c25f-4e52-a073-7742a9fde305
    description: Every user can see users, for created_by labels.
    effect: allow
    roles: [authenticated]
    table: core.user
    target: records
    actions: [read]
  - id: 7b96eca1-1c94-4ff2-b0cd-d26684ca6040
    description: Every user can read user names, for created_by labels.
    effect: allow
    roles: [authenticated]
    table: core.user
    target: fields
    fields: [name]
    actions: [read]
  - id: 1915c6fe-e27b-45cd-91e5-479392469c3d
    description: Users are deactivated, never deleted (Contracts 3.10).
    effect: deny
    roles: [authenticated]
    table: core.user
    target: records
    actions: [delete]
  - id: edb47a5e-5f6d-4ad3-bcf7-bdb655ce8d80
    description: Dead-delivery actions are appended only by their tasks, never edited or deleted.
    effect: deny
    roles: [authenticated]
    table: core.dead_delivery_action
    target: records
    actions: [create, update, delete]
