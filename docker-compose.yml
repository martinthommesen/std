# A fixed project name, so every checkout and worktree shares one server.
name: std
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: std
      POSTGRES_PASSWORD: std
      POSTGRES_DB: std
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # STD_POSTGRES_PORT moves the host port, for a second stack beside the
      # shared one (`docker compose -p <name>`); the default is unchanged.
      - "127.0.0.1:${STD_POSTGRES_PORT:-54329}:5432"
    command:
      ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=1GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U std -d std"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - std-pg:/var/lib/postgresql

  # The quickstart (README.md, "Quickstart"; decision 0016). `docker compose
  # up` runs `upgrade` once, then starts `server`. `pnpm db:up` starts only
  # Postgres, as before.
  #
  # `upgrade` applies platform migrations and loads the core definition set
  # and the helpdesk example (`std upgrade --set examples/helpdesk/v2`),
  # then creates the first administrator unless that login exists
  # (`std bootstrap-admin`), then the helpdesk's demo users `admin`, `agent`
  # and `agent2` and, on an empty helpdesk, its demo incidents
  # (`pnpm helpdesk:seed`; README.md, "Helpdesk"). STD_HELPDESK=0 leaves
  # the helpdesk out. Contracts 1.9: migrations never run at server start,
  # so the server waits for it to exit 0.
  upgrade:
    build:
      context: .
      dockerfile: docker/quickstart.Dockerfile
    init: true
    command:
      [
        "sh",
        "-c",
        'if [ "$$STD_HELPDESK" = 0 ]; then pnpm --silent std upgrade && pnpm --silent std bootstrap-admin; else pnpm --silent std upgrade --set examples/helpdesk/v2 && pnpm --silent std bootstrap-admin && pnpm --silent helpdesk:seed; fi',
      ]
    environment:
      STD_DATABASE_URL: ${STD_COMPOSE_DATABASE_URL:-postgres://std:std@postgres:5432/std}
      STD_ADMIN_LOGIN: ${STD_ADMIN_LOGIN:-administrator}
      # A disposable demo credential; set your own for anything but a demo.
      STD_ADMIN_PASSWORD: ${STD_ADMIN_PASSWORD:-quickstart-admin-password}
      # The helpdesk example: 0 leaves it out. Its demo users' passwords
      # default to the disposable demo credentials of
      # packages/testing/src/helpdesk-fixture.ts; set your own for anything
      # but a local demo.
      STD_HELPDESK: ${STD_HELPDESK:-1}
      HELPDESK_ADMIN_PASSWORD: ${HELPDESK_ADMIN_PASSWORD:-helpdesk-admin-demo-password}
      HELPDESK_AGENT_PASSWORD: ${HELPDESK_AGENT_PASSWORD:-helpdesk-agent-demo-password}
      HELPDESK_AGENT2_PASSWORD: ${HELPDESK_AGENT2_PASSWORD:-helpdesk-agent2-demo-password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # `std serve`: the web app at http://localhost:${STD_HTTP_PORT:-8080}/ and
  # the HTTP API under /api/v1. The image builds the app (apps/web/dist, the
  # default STD_WEB_ROOT). Over plain HTTP on localhost the session cookie
  # leaves out Secure (STD_SESSION_COOKIE_SECURE=auto; decision 0018).
  server:
    build:
      context: .
      dockerfile: docker/quickstart.Dockerfile
    init: true
    command: ["pnpm", "--silent", "std", "serve"]
    environment:
      STD_DATABASE_URL: ${STD_COMPOSE_DATABASE_URL:-postgres://std:std@postgres:5432/std}
      STD_HTTP_HOST: 0.0.0.0
      STD_HTTP_PORT: "8080"
      STD_TIME_ZONE: ${STD_TIME_ZONE:-UTC}
    ports:
      - "127.0.0.1:${STD_HTTP_PORT:-8080}:8080"
    depends_on:
      upgrade:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/v1/openapi.json').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # `std worker`: the outbox worker (Contracts 4.6; decision 0023). It runs
  # the after-commit effects of saves and change sets, beside the server.
  worker:
    build:
      context: .
      dockerfile: docker/quickstart.Dockerfile
    init: true
    command: ["pnpm", "--silent", "std", "worker"]
    environment:
      STD_DATABASE_URL: ${STD_COMPOSE_DATABASE_URL:-postgres://std:std@postgres:5432/std}
      STD_TIME_ZONE: ${STD_TIME_ZONE:-UTC}
    depends_on:
      upgrade:
        condition: service_completed_successfully
volumes:
  std-pg:
