# A fixed project name, so every checkout and worktree shares one server.
name: std
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: std
      POSTGRES_PASSWORD: std
      POSTGRES_DB: std
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:54329:5432"
    command:
      ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=1GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U std -d std"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - std-pg:/var/lib/postgresql
volumes:
  std-pg:
