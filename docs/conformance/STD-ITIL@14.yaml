# Requirements matrix (Contracts 15): ITIL behaviors as STD states them
# (Contracts 14). ITIL defines practices, not tool states, so these rows test
# STD's own statement of each practice. STD copies no ITIL text; notes name the
# ITIL 4 practice concept a row implements, in STD's words. ITIL® is a
# registered trademark of the PeopleCert group.
#
# Step 3 rows only (Contracts 14.1 to 14.3 and the Step 3 rule kinds of 14.4);
# workstreams 4O and 4C add the change, request and CMDB rows with step: 4.
spec: STD-ITIL
version: "14"
title: ITIL 4 practices as STD states them (Contracts 14)
sources:
  - id: C14
    document: STD Contracts, section 14 (docs/contracts.md)
    version: "14"
    licence: Apache-2.0 (STD's own text)
    note: Each row's note names the ITIL 4 practice concept it implements; edition review before v0.1.0 (resolved question 8).
rows:
  - id: STD-ITIL@14/C14/14.1/shipped-configuration
    source: "Contracts 14.1 (shipped configuration and every-test bullet)"
    level: mandatory
    requirement: "Every ITIL behavior of the helpdesk set is shipped configuration (choices, record rules, access rules), so an install changes it through overrides and local rules without code."
    note: "ITIL 4 describes practices, not tool states; STD's state models are its own statement of them."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#a local rule replaces one priority cell without changing the others
  - id: STD-ITIL@14/C14/14.1/every-surface
    source: Contracts 14.1 (shipped configuration and every-test bullet); plan Step 3 gate (ITIL)
    level: mandatory
    requirement: Every incident and problem behavior below is tested through the generic API, TMF621 and, where a form exists, the browser, including the intentional form constraints and API permissiveness of Contracts 14.1.
    status: tested
    note: STD Contracts 14 Step 3 profile only. docs/conformance/itil-surfaces.md maps every behavior to its generic API, TMF621 and browser assertions and records surface applicability, inherited ticket rules and remaining external/licensed facts. State-pair refusals, reopen/closed dates, exact cascade partitions and inherited defaults/derives are explicitly observed. This does not certify licensed ITIL guidance or the whole Step 3 release gate.
    tests:
      - packages/server/test/itil-incident.test.ts#a local rule replaces one priority cell without changing the others
      - packages/server/test/itil-incident.test.ts#labels clear after derivation, supplied labels survive, and parent endpoints use incident rules
      - packages/server/test/itil-incident.test.ts#TMF621 accepts a resolve without resolution code and notes and renders the major flag as a characteristic
      - packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write
      - packages/server/test/itil-problem.test.ts#every TMF621 status write is an allowed problem transition or is refused with no write
      - packages/server/test/itil-problem.test.ts#known errors work in every state without API-only workaround or root-cause restrictions
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic
      - packages/server/test/itil-incident.test.ts#explicit priority wins even equal to the previous value and JSON Patch preserves supplied-field provenance
      - packages/server/test/itil-incident.test.ts#an explicit TMF621 priority wins over the matrix, by merge-patch and JSON Patch, and a test of /priority supplies nothing
      - apps/web/test/browser/incident-form.test.ts#creates an incident, shows derived read-only priority, requires resolution details, and clears a manager's major flag below priority 1
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - apps/web/test/browser/incident-form.test.ts#incident and problem forms default, require and retain hold reasons, then clear them on leaving hold
      - packages/server/test/itil-incident.test.ts#hold defaults, writable resolution fields, and bounded Unicode titles are shipped derives
      - packages/server/test/tmf621.test.ts#statuses follow TMF621's life cycle onto the incident state model, and stored states read back
      - packages/server/test/tmf621.test.ts#held keeps a hold reason the holdReason characteristic names, and pending is awaiting the caller
      - packages/server/test/itil-incident.test.ts#settled saves bypass incident transition guards
      - packages/server/test/form-vs-api.test.ts#resolving without code/notes is accepted by the API while the form requires both
      - packages/server/test/form-vs-api.test.ts#through TMF621, resolving without resolution code and notes is accepted while the form requires both
      - packages/server/test/itil-incident.test.ts#major incident permission holds through the API while priority never clears the flag and children resolve together
      - apps/web/test/browser/incident-form.test.ts#a local priority cell controls the manager form verdict and saved correction while the same API edit keeps the major flag
      - apps/web/test/browser/incident-form.test.ts#an agent retains a major flag below priority 1 with a notice and can find it through the mismatch filter
      - packages/server/test/form-vs-api.test.ts#through TMF621, form-locked priority, labels, dates, type and history stay writable, and the hidden major flag is written
      - packages/server/test/itil-problem.test.ts#every problem transition including TMF621 allowances is accepted or refused without a write
      - packages/server/test/itil-problem.test.ts#settled saves bypass problem transition guards
      - apps/web/test/browser/incident-form.test.ts#a problem follows Assess and requires a workaround for known error and root cause for a fix
      - apps/web/test/browser/incident-form.test.ts#a problem form refuses empty workaround and resolved root cause without a write, then saves supplied details
      - packages/server/test/itil-problem.test.ts#TMF621 creates and patches known errors without workaround and preserves fixing within inProgress without root cause
      - packages/server/test/itil-problem.test.ts#an incident names its problem as the TMF621 relationship causedBy
      - packages/server/test/itil-problem.test.ts#resolving a problem returns exactly its awaiting-problem incidents to work in one operation
      - packages/server/test/record-rules.test.ts#guard and invariant refuse with the rule's fixed message; a settled save runs only invariants
      - packages/server/test/aggregate-finalize.test.ts#no guard or derive rule runs on a persisted save, while guards still refuse users and derive values reach the settled image
      - apps/web/test/browser/itil-lifecycle.test.ts#every incident browser state pair saves or refuses without changing the stored record, including reopen and closed dates
      - apps/web/test/browser/itil-lifecycle.test.ts#every problem browser state pair respects Assess choices or saves or refuses without changing the stored record
      - apps/web/test/browser/itil-lifecycle.test.ts#ticket forms and both subclasses inherit title derivation, defaults, locked fields and hold and resolution form rules
      - apps/web/test/browser/itil-lifecycle.test.ts#an incident saved from the parent Ticket form keeps its concrete priority and derives its resolution date
      - apps/web/test/browser/itil-cascades.test.ts#resolving a major in the browser resolves exactly its open children with the same resolution and leaves terminal and unrelated records unchanged
      - apps/web/test/browser/itil-cascades.test.ts#resolving a problem in the browser resumes only its awaiting-problem incidents and never resolves an incident automatically
      - apps/web/test/browser/itil-cascades.test.ts#browser incident links persist their parent and problem and the open-major filter lists exactly open major states
      - apps/web/test/browser/itil-lifecycle.test.ts#a known error can be saved from every problem state while the browser requires its workaround
      - apps/web/test/browser/itil-lifecycle.test.ts#development DevTools report the saved hold default and its removal after browser resume
      - packages/server/test/itil-surfaces.test.ts#generic and TMF621 major resolution select every open child and preserve all terminal and unrelated records
      - packages/server/test/itil-surfaces.test.ts#generic and TMF621 problem resolution resume exactly linked awaiting-problem incidents across every incident state and hold reason
      - packages/server/test/itil-surfaces.test.ts#ticket derives and API-writable resolution dates hold for tickets, incidents and problems through both APIs
      - packages/server/test/itil-surfaces.test.ts#TMF621 known-error writes preserve every concrete problem state without requiring a workaround
      - packages/server/test/itil-surfaces.test.ts#TMF621 refuses an agent's major flag write without changing the record
      - apps/web/test/browser/incident-form.test.ts#all nine priority cells agree between the browser verdict and independently read saved records
      - packages/server/test/itil-surfaces.test.ts#a local priority replacement changes only its cell through both APIs and TMF621 retains the major flag
  - id: STD-ITIL@14/C14/14.1/concrete-class
    source: "Contracts 14.1; plan Step 3 gate (rules follow the concrete class)"
    level: mandatory
    requirement: "Rules follow the record's concrete class: an incident saved through /api/v1/helpdeskTicket gets the incident's derived priority and resolved_at."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#labels clear after derivation, supplied labels survive, and parent endpoints use incident rules
  - id: STD-ITIL@14/C14/14.1/tmf-over-itil
    source: "Contracts 14.1 (TM Forum takes priority over ITIL; decision 0021, decision 34)"
    level: mandatory
    requirement: "Where TMF621 allows a write that an ITIL behavior would refuse, every API accepts it: the ITIL behavior is a default (a derive rule) and, for people, a form rule; no guard or invariant refuses what TMF621 allows."
    status: tested
    tests:
      - "packages/server/test/itil-incident.test.ts#TMF621 accepts a resolve without resolution code and notes and renders the major flag as a characteristic"
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
      - "packages/server/test/itil-problem.test.ts#every TMF621 status write is an allowed problem transition or is refused with no write"
      - "packages/server/test/itil-problem.test.ts#known errors work in every state without API-only workaround or root-cause restrictions"
  - id: STD-ITIL@14/C14/14.2/impact-urgency
    source: "Contracts 14.2 (first bullet)"
    level: mandatory
    requirement: "An incident has impact and urgency, each a choice of 1 (high), 2 (medium) or 3 (low), always set; each defaults to 3, so a TMF621 create naming only severity, or a severity STD does not map, is valid."
    note: "ITIL 4 incident management practice: an incident's priority weighs its impact on the business against how urgently it needs resolving."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-1-urgency-1
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 1 and urgency 1, priority becomes 1, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-1-urgency-2
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 1 and urgency 2, priority becomes 2, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-2-urgency-1
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 2 and urgency 1, priority becomes 2, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-1-urgency-3
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 1 and urgency 3, priority becomes 3, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-2-urgency-2
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 2 and urgency 2, priority becomes 3, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-3-urgency-1
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 3 and urgency 1, priority becomes 3, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-2-urgency-3
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 2 and urgency 3, priority becomes 4, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-3-urgency-2
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 3 and urgency 2, priority becomes 4, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority/impact-3-urgency-3
    source: "Contracts 14.2 (first bullet), priority matrix"
    level: mandatory
    requirement: "When impact or urgency changes to impact 3 and urgency 3, priority becomes 5, set by its own shipped derive rule."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through the generic API
      - "packages/server/test/itil-incident.test.ts#all nine shipped matrix cells derive priority through TMF621 severity and the urgency characteristic"
  - id: STD-ITIL@14/C14/14.2/priority-explicit-wins
    source: "Contracts 14.2 (first bullet); decision 0021, decision 53"
    level: mandatory
    requirement: "A write that names priority (1 critical to 5 planning), even with its current value, keeps it when the same write changes impact or urgency (the matrix rules keep supplied fields), through every API."
    status: tested
    tests:
      - "packages/server/test/itil-incident.test.ts#explicit priority wins even equal to the previous value and JSON Patch preserves supplied-field provenance"
      - "packages/server/test/itil-incident.test.ts#an explicit TMF621 priority wins over the matrix, by merge-patch and JSON Patch, and a test of /priority supplies nothing"
  - id: STD-ITIL@14/C14/14.2/priority-form-read-only
    source: "Contracts 14.2 (first bullet)"
    level: mandatory
    requirement: "The incident form shows priority read-only by default (a form rule)."
    status: tested
    tests:
      - "apps/web/test/browser/incident-form.test.ts#creates an incident, shows derived read-only priority, requires resolution details, and clears a manager's major flag below priority 1"
  - id: STD-ITIL@14/C14/14.2/priority-cell-override
    source: "Contracts 14.2 (first bullet)"
    level: mandatory
    requirement: "An admin changes one matrix cell by deactivating its shipped rule and adding a local rule; the other cells keep working."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#a local rule replaces one priority cell without changing the others
  - id: STD-ITIL@14/C14/14.2/states
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "Incident states are new, in_progress, on_hold, resolved, closed and canceled."
    note: "STD treats an unexpected service failure or deterioration as an incident and tracks recovery to normal operation. Paraphrase of the ITIL 4 incident management practice; see PeopleCert, ITIL 4 Practitioner: Incident Management, Key Concepts (https://www.peoplecert.org/browse-certifications/it-governance-and-service-management/ITIL-1/itil4-practices-incident-management-3684)."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/hold-reason
    source: "Contracts 14.2 (second bullet); Contracts 14.4 rule kinds (incident derive)"
    level: mandatory
    requirement: "Entering on_hold without a hold_reason (awaiting_caller, awaiting_change, awaiting_problem, awaiting_vendor) sets awaiting_vendor, leaving on_hold clears it, and the form requires it while on hold."
    status: tested
    tests:
      - "apps/web/test/browser/incident-form.test.ts#incident and problem forms default, require and retain hold reasons, then clear them on leaving hold"
      - "packages/server/test/itil-incident.test.ts#hold defaults, writable resolution fields, and bounded Unicode titles are shipped derives"
      - "packages/server/test/tmf621.test.ts#statuses follow TMF621's life cycle onto the incident state model, and stored states read back"
      - "packages/server/test/tmf621.test.ts#held keeps a hold reason the holdReason characteristic names, and pending is awaiting the caller"
  - id: STD-ITIL@14/C14/14.2/transitions/from-new
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "From new an incident may move only to in_progress, on_hold, resolved or canceled; a user's write of any other status is InvalidTransition (422) and writes nothing. Every TMF621 life-cycle transition is among the allowed ones."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/transitions/from-in-progress
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "From in_progress an incident may move only to on_hold, resolved or canceled; a user's write of any other status is InvalidTransition (422) and writes nothing. Every TMF621 life-cycle transition is among the allowed ones."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/transitions/from-on-hold
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "From on_hold an incident may move only to in_progress, resolved or canceled; a user's write of any other status is InvalidTransition (422) and writes nothing. Every TMF621 life-cycle transition is among the allowed ones."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/transitions/from-resolved
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "From resolved an incident may move only to in_progress (reopen) or closed; a user's write of any other status is InvalidTransition (422) and writes nothing. Every TMF621 life-cycle transition is among the allowed ones."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/transitions/final
    source: "Contracts 14.2 (second bullet)"
    level: mandatory
    requirement: "closed and canceled are final: any status change from them is InvalidTransition and writes nothing."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#every incident transition is accepted or refused with no write exactly as Contracts 14 specifies
      - "packages/server/test/itil-incident.test.ts#every TMF621 status write is an allowed incident transition or is refused with no write"
  - id: STD-ITIL@14/C14/14.2/transition-guards-kind
    source: "Contracts 14.4 rule kinds (incident guard)"
    level: mandatory
    requirement: "The transition rules are one guard per source state, so they judge users' writes and never the saves that aggregate settling persists."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#settled saves bypass incident transition guards
  - id: STD-ITIL@14/C14/14.2/resolution-required
    source: "Contracts 14.2 (third bullet); Contracts 14.1"
    level: mandatory
    requirement: "The incident form requires resolution_code and resolution_notes to resolve; every API accepts a resolve without them."
    status: tested
    tests:
      - "apps/web/test/browser/incident-form.test.ts#creates an incident, shows derived read-only priority, requires resolution details, and clears a manager's major flag below priority 1"
      - "packages/server/test/form-vs-api.test.ts#resolving without code/notes is accepted by the API while the form requires both"
      - "packages/server/test/form-vs-api.test.ts#through TMF621, resolving without resolution code and notes is accepted while the form requires both"
  - id: STD-ITIL@14/C14/14.2/resolved-at
    source: "Contracts 14.2 (third bullet); Contracts 14.4 rule kinds (ticket derive)"
    level: mandatory
    requirement: "Entering resolved sets resolved_at unless the write gives it; leaving resolved (reopen) clears it; entering closed keeps the resolution fields and resolved_at."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#hold defaults, writable resolution fields, and bounded Unicode titles are shipped derives
  - id: STD-ITIL@14/C14/14.2/major-incident-role
    source: "Contracts 14.2 (fourth bullet)"
    level: mandatory
    requirement: "Only the major_incident_manager role can set major_incident (an access rule on the field)."
    note: "ITIL 4 incident management practice: a major incident is handled by its own procedure, under a dedicated manager."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#major incident permission holds through the API while priority never clears the flag and children resolve together
  - id: STD-ITIL@14/C14/14.2/major-incident-priority
    source: "Contracts 14.2 (fourth bullet); Contracts 14.1"
    level: mandatory
    requirement: "The incident form offers major_incident only while priority is 1; when a form edit drops priority below 1 with the flag set, the form clears it for a user who may write it and otherwise keeps it with a notice and lists the incident in the shipped filter of major incidents not at priority 1; the APIs accept the flag at any priority and never clear it."
    status: tested
    tests:
      - "apps/web/test/browser/incident-form.test.ts#creates an incident, shows derived read-only priority, requires resolution details, and clears a manager's major flag below priority 1"
      - "apps/web/test/browser/incident-form.test.ts#a local priority cell controls the manager form verdict and saved correction while the same API edit keeps the major flag"
      - "apps/web/test/browser/incident-form.test.ts#an agent retains a major flag below priority 1 with a notice and can find it through the mismatch filter"
      - "packages/server/test/itil-incident.test.ts#major incident permission holds through the API while priority never clears the flag and children resolve together"
      - "packages/server/test/itil-incident.test.ts#TMF621 accepts a resolve without resolution code and notes and renders the major flag as a characteristic"
      - "packages/server/test/form-vs-api.test.ts#through TMF621, form-locked priority, labels, dates, type and history stay writable, and the hidden major flag is written"
  - id: STD-ITIL@14/C14/14.2/form-vs-api
    source: "Contracts 14.1; Contracts 5.10"
    level: mandatory
    requirement: "Form rules are browser validation, not record-service acceptance: the incident form prevents a resolve without resolution code and notes, and the same payload is accepted through /api/v1 and TMF621."
    status: tested
    tests:
      - "apps/web/test/browser/incident-form.test.ts#creates an incident, shows derived read-only priority, requires resolution details, and clears a manager's major flag below priority 1"
      - "packages/server/test/form-vs-api.test.ts#resolving without code/notes is accepted by the API while the form requires both"
      - "packages/server/test/form-vs-api.test.ts#through TMF621, resolving without resolution code and notes is accepted while the form requires both"
    note: "The browser suite's resolution case requires both fields; the API and TMF621 accept the same resolve (decisions 0035, 0036)."
  - id: STD-ITIL@14/C14/14.2/major-incident-tmf621
    source: "Contracts 14.2 (fourth bullet); Contracts 11.2 troubleTicketCharacteristic"
    level: mandatory
    requirement: "TMF621 renders major_incident as the majorIncident characteristic."
    status: tested
    tests:
      - "packages/server/test/itil-incident.test.ts#TMF621 accepts a resolve without resolution code and notes and renders the major flag as a characteristic"
  - id: STD-ITIL@14/C14/14.2/major-incident-filter
    source: "Contracts 14.2 (fourth bullet)"
    level: mandatory
    requirement: "A shipped saved filter lists open major incidents."
    status: tested
    tests:
      - packages/server/test/itil-incident.test.ts#major incident permission holds through the API while priority never clears the flag and children resolve together
