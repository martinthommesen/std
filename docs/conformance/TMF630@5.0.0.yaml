    status: pending
    note: "Scoped evidence (packages/server/test/tmf-paging.test.ts#filtered cursor ends omit empty adjacent pages and malformed cursors fail with 400): the cited generic HTTP test submits malformed after and before and asserts 400 InvalidCursor. Pending across independent cursor paths: api-history-paging covers malformed after and retained range, but not malformed before; dead-letter-api offset=0&after=bad proves the offset/cursor conflict, not decoding. event-paging covers malformed/unknown resource-event continuations and mismatched filters, and event-lookups covers unknown client after; these do not complete history, deadDelivery or mapped-interface proof. TMF688 topics/hubs are offset-only."
  - id: TMF630@5.0.0/P1/4.5.3/cursor-navigation-link-header
