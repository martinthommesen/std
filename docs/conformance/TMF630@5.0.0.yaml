    source: TMF630 v5.0.0 P1 §6.1 p.117
    level: mandatory
    requirement: A successful synchronous creation response must carry a `Location` header with the new resource's URI.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `201` with `Location`"
  - id: TMF630@5.0.0/P1/6.1/create-async-202
    source: TMF630 v5.0.0 P1 §6.1 p.117
    level: mandatory
    requirement: When a creation is processed asynchronously, the server must answer 202 Accepted.
    status: pending
    note: "C10.5: every create runs synchronously in the request transaction (4.1), so 202 never arises"
  - id: TMF630@5.0.0/P1/6.1/create-response-id-href-type
    source: TMF630 v5.0.0 P1 §6.1 p.121
    level: mandatory
    requirement: The creation response must contain `id`, `href` and `@type`.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: `id`, `href` and `@type` are always present"
  - id: TMF630@5.0.0/P1/6.1/create-no-empty-string-attributes
    source: TMF630 v5.0.0 P1 §6.1 p.121
    level: mandatory
    requirement: A create payload must not carry attributes set to the empty string (for example an empty date).
    status: pending
    note: "client-side: binds the caller; STD turns empty text into null and refuses an empty value for other types (6.5, 6.7)"
  - id: TMF630@5.0.0/P1/6.2/post-attribute-selection
    source: TMF630 v5.0.0 P1 §6.2 p.123
    level: optional
    requirement: A server may support attribute selection (`fields`, including `fields=none`) on POST to shape the creation response.
    status: pending
    note: "gap: Contracts 10.3 defines `fields` only on lists and reads, and an unknown query parameter is `InvalidRequest`, so `fields` on a POST is refused"
  - id: TMF630@5.0.0/P1/7/delete-uses-http-delete
    source: TMF630 v5.0.0 P1 §7 p.126
    level: mandatory
    requirement: A delete operation must use HTTP DELETE on the resource's URI.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `DELETE /api/v1/{table}/{id}`"
  - id: TMF630@5.0.0/P1/7/delete-no-request-payload
    source: TMF630 v5.0.0 P1 §7 p.126
    level: mandatory
    requirement: A delete operation must not accept a request body.
    status: pending
    note: "gap: Contracts 10.5 does not say what a DELETE with a body gets; state that it is refused (`InvalidRequest`) and test it"
  - id: TMF630@5.0.0/P1/7/delete-enacted-204
    source: TMF630 v5.0.0 P1 §7 p.126
    level: recommended
    requirement: After a delete that has been carried out and needs no further information, the server should answer 204 No Content.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `204` with no body"
  - id: TMF630@5.0.0/P1/7/delete-pending-202
    source: TMF630 v5.0.0 P1 §7 p.126
    level: recommended
    requirement: When a delete is accepted but not yet carried out, the server should answer 202 Accepted.
    status: pending
    note: "C10.5: deletes run synchronously (4.1), so 202 never arises"
  - id: TMF630@5.0.0/P1/8/collection-json-patch-bulk
    source: TMF630 v5.0.0 P1 §8 p.128
    level: optional
    requirement: A server may accept a JSON Patch (`application/json-patch+json`) on a collection resource to create, update or delete several members in one atomic request.
    status: pending
    note: "gap: the API defines no `PATCH /api/v1/{table}`; bulk writes exist only as jobs (Contracts 7.7), so the Chapter 8 rows below apply only if it is added"
  - id: TMF630@5.0.0/P1/8.1/add-op-for-new-member
    source: TMF630 v5.0.0 P1 §8.1 p.128
    level: mandatory
    requirement: To add a member to a collection, the patch directive must use `op` `add`, the member being created at the element the path names.
    status: pending
    note: "client-side: how the patch author writes the document; STD has no collection PATCH (see 8/collection-json-patch-bulk)"
  - id: TMF630@5.0.0/P1/8.1/append-path-ends-dash
    source: TMF630 v5.0.0 P1 §8.1 p.128
    level: mandatory
    requirement: To append a member at the end of the collection array, the `add` path must end with `/-` (RFC 6902 4.1).
    status: pending
    note: "client-side: how the patch author writes the document; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.1/added-member-required-attributes
    source: TMF630 v5.0.0 P1 §8.1 p.128
    level: mandatory
    requirement: An added member need not carry every attribute, but all required attributes must be present.
    status: pending
    note: "client-side: binds the patch author; STD has no collection PATCH (a create without a required field is `ValidationFailed` `Required`, 3.8)"
  - id: TMF630@5.0.0/P1/8.2/replace-op-for-update
    source: TMF630 v5.0.0 P1 §8.2 p.128
    level: mandatory
    requirement: To update an existing member, the directive must use `op` `replace` with a path pointing at that member.
    status: pending
    note: "client-side: how the patch author writes the document; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.2/replace-value-whole-member
    source: TMF630 v5.0.0 P1 §8.2 p.128
    level: mandatory
    requirement: The `value` of a `replace` directive must hold the new member, which replaces the existing one completely.
    status: pending
    note: "client-side: binds the patch author; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.2/replaced-member-required-attributes
    source: TMF630 v5.0.0 P1 §8.2 p.129
    level: mandatory
    requirement: A replacement member need not carry every attribute, but all required attributes must be present.
    status: pending
    note: "client-side: binds the patch author; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.3/remove-op-for-delete
    source: TMF630 v5.0.0 P1 §8.3 p.129
    level: mandatory
    requirement: To remove a member, the directive must use `op` `remove` with a path pointing at that member.
    status: pending
    note: "client-side: how the patch author writes the document; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.3/remove-without-value
    source: TMF630 v5.0.0 P1 §8.3 p.129
    level: mandatory
    requirement: A `remove` directive must not carry a `value` element.
    status: pending
    note: "client-side: binds the patch author; STD has no collection PATCH"
  - id: TMF630@5.0.0/P1/8.3/removed-member-no-representation
    source: TMF630 v5.0.0 P1 §8.3 p.129
    level: mandatory
    requirement: The server's response must not include a representation of members that the patch removed.
    status: pending
    note: "gap: STD has no collection PATCH (see 8/collection-json-patch-bulk)"
  - id: TMF630@5.0.0/P1/8.4/mixed-operations
    source: TMF630 v5.0.0 P1 §8.4 p.129
    level: optional
    requirement: A collection PATCH may mix `add`, `replace` and `remove` directives as long as their paths are valid and do not conflict; they apply in the order given.
    status: pending
    note: "gap: STD has no collection PATCH (see 8/collection-json-patch-bulk)"
  - id: TMF630@5.0.0/P1/8.5/patch-not-201-or-204
    source: TMF630 v5.0.0 P1 §8.5 p.129
    level: mandatory
    requirement: A successful PATCH must not be answered with 201 Created or 204 No Content (200 when synchronous, 202 when asynchronous).
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: PATCH success is `200` with the resource"
  - id: TMF630@5.0.0/P1/8.5/patch-malformed-400
    source: TMF630 v5.0.0 P1 §8.5 p.129
    level: mandatory
    requirement: The server must answer 400 Bad Request when a PATCH body is not valid JSON, a path is not a valid JSON Pointer, or an `op` is not an allowed value.
    status: pending
    note: "gap: Contracts 3.8 gives `InvalidRequest` 400 only for malformed query parameters; state that a malformed patch body, pointer or `op` is 400 (10.5 maps an unknown path name to `UnknownField`, also 400)"
  - id: TMF630@5.0.0/P1/8.5/patch-first-failing-op-status
    source: TMF630 v5.0.0 P1 §8.5 p.129
    level: mandatory
    requirement: Otherwise the server must answer a failed PATCH with the status of the first failing operation, in the order of the directives (and of the elements a path selects).
    status: pending
    note: "C10.5: JSON Patch operations apply in order and a failed `test` is `409 PatchTestFailed`; validation of the resulting body reports all field errors together (6.7), so check that the status still follows the first failure"
  - id: TMF630@5.0.0/P1/9.1/task-name-is-verb
    source: TMF630 v5.0.0 P1 §9.1 p.138
    level: mandatory
    requirement: An API specification must name a task resource with a verb for the task executed (validate, check, close, transfer, and so on).
    status: pending
    note: "C10.1: task resources `formStateCheck` and `changeSet` are named as nouns (a verb form such as `checkFormState` would comply) CONTRADICTION: TMF630 v5.0.0 P1 §9.1 p.138 says a task resource's name must be a verb for the task; Contracts 10.1 names its task resources `formStateCheck` and `changeSet`, which are noun phrases."
  - id: TMF630@5.0.0/P1/9.1/runtime-short-or-long-task
    source: TMF630 v5.0.0 P1 §9.1 p.139
    level: optional
    requirement: A server whose task supports both short- and long-running execution may choose at run time which to use, for example from the request payload.
    status: pending
    note: "C10.1: STD's task resources (`formStateCheck`, `changeSet`) run as short-running requests only; the option is not used"
  - id: TMF630@5.0.0/P1/9.1/persisted-task-id-href-type-location
    source: TMF630 v5.0.0 P1 §9.1 p.139
    level: mandatory
    requirement: When a task operation creates and persists a task resource, the server must return its `id`, `href`, `@type` and a `Location` header.
    status: pending
    note: "gap: Contracts 10.1 lists `POST /api/v1/changeSet` (201) but does not state that its response carries `id`, `href`, `@type` and `Location`"
  - id: TMF630@5.0.0/P1/9.1/task-id-is-task-resource
    source: TMF630 v5.0.0 P1 §9.1 p.139
    level: mandatory
    requirement: An `id` returned by a task operation must identify the task resource that was created.
    status: pending
    note: "C10.1: a `changeSet` response's `id` is the change set's own ID, read back at `GET /api/v1/changeSet/{id}`"
  - id: TMF630@5.0.0/P1/9.1/task-iterators-optional
    source: TMF630 v5.0.0 P1 §9.1 p.139
    level: optional
    requirement: A server may support iterators (sub-resource collections) on task resources.
    status: pending
    note: "gap: STD defines no iterator on its task resources (optional)"
  - id: TMF630@5.0.0/P1/9.2/persisted-short-task-201
    source: TMF630 v5.0.0 P1 §9.2 p.140
    level: mandatory
    requirement: When a short-running task's resource is persisted, the server must answer 201 Created with the task resource, its `id`, `href` and `@type`, and a `Location` header naming it.
    status: pending
    note: "C10.1: `POST /api/v1/changeSet` is 201 (1.4); `href`, `@type` and `Location` are not stated (see 9.1/persisted-task-id-href-type-location)"
  - id: TMF630@5.0.0/P1/9.2/persisted-task-holds-result
    source: TMF630 v5.0.0 P1 §9.2 p.140
    level: recommended
    requirement: A persisted short-running task resource returned to the client should include the operation's result data, if any.
    status: pending
    note: "C10.1: a `changeSet` response and `GET /api/v1/changeSet/{id}` return the journal entry and steps (1.4)"
  - id: TMF630@5.0.0/P1/9.3/long-task-create-persist-in-call
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: mandatory
    requirement: For a long-running task the server must create and persist the task resource and return it in the same call, even though execution has not finished.
    status: pending
    note: "gap: C10.1 names changeSet and formStateCheck as task resources but fixes no long-running task behaviour; a change set's follow-up steps run after the 201 (Contracts 1.4) with STD's own states"
  - id: TMF630@5.0.0/P1/9.3/long-task-execution-may-not-have-started
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: optional
    requirement: The server may return the long-running task resource before task execution has even started.
    status: pending
    note: "gap: C10.1 does not describe when changeSet execution starts relative to the response"
  - id: TMF630@5.0.0/P1/9.3/long-task-id-href-type-state
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: mandatory
    requirement: A long-running task resource must carry id, href, @type and a state attribute showing whether the task is still in progress (the state requirement is restated later on the page).
    status: pending
    note: "gap: C10.2 gives id, href and @type to records, but C10.1 does not define the changeSet task resource's representation or a TMF task state"
  - id: TMF630@5.0.0/P1/9.3/long-task-201-location
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: mandatory
    requirement: The server must return a long-running task resource with 201 Created and a Location header identifying it.
    status: pending
    note: "gap: Contracts 1.4 returns 201 for a change set, but C10.1 does not state the Location header for changeSet"
  - id: TMF630@5.0.0/P1/9.3/long-task-retain-while-in-progress
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: recommended
    requirement: The server should keep a long-running task resource at least for as long as the task is in progress.
    status: pending
    note: "C10.1: GET /api/v1/changeSet/{id} reads the change-set journal, which is kept (Contracts 1.4)"
  - id: TMF630@5.0.0/P1/9.3/long-task-retain-longer
    source: TMF630 v5.0.0 P1 §9.3 p.146
    level: optional
    requirement: The server may keep the task resource beyond the task's completion, for an implementation-defined period.
    status: pending
    note: "C10.1: change-set journal entries stay readable through GET /api/v1/changeSet/{id}"
  - id: TMF630@5.0.0/P1/9.4/long-task-implements-lifecycle
    source: TMF630 v5.0.0 P1 §9.4 p.146
    level: mandatory
    requirement: A long-running task must implement the TMF task lifecycle (acknowledged, inProgress, then done, terminatedWithError, rejected or cancelled).
    status: pending
    note: "gap: change sets use STD's own states (applying, completed, needs_attention; Contracts 1.4), and C10.1 maps no TMF task states onto them"
  - id: TMF630@5.0.0/P1/9.4/short-task-lifecycle-optional
    source: TMF630 v5.0.0 P1 §9.4 p.146
    level: optional
    requirement: A short-running task may implement the task lifecycle but need not.
    status: pending
    note: "C10.1: formStateCheck is a short-running task resource; no lifecycle needed"
  - id: TMF630@5.0.0/P1/9.4/task-200-not-persisted
    source: TMF630 v5.0.0 P1 §9.4 p.147
    level: mandatory
    requirement: The server must answer a task operation with 200 OK and the full result when the task completed and no task resource was persisted.
    status: pending
    note: "gap: C10.1 calls formStateCheck a task resource but does not fix its status code (200 for an unpersisted result)"
  - id: TMF630@5.0.0/P1/9.4/task-201-persisted
    source: TMF630 v5.0.0 P1 §9.4 p.147
    level: mandatory
    requirement: The server must answer a task operation with 201 Created and the full task resource when the task resource was created and persisted.
    status: pending
    note: "C10.1: POST /api/v1/changeSet keeps the 201 of Contracts 1.4"
  - id: TMF630@5.0.0/P1/9.4/task-202-async
    source: TMF630 v5.0.0 P1 §9.4 p.147
    level: mandatory
    requirement: The server must answer a task operation with 202 Accepted when it creates the task resource asynchronously.
    status: pending
    note: "gap: STD has no asynchronous operations and never returns 202; every task resource is created within the request"
  - id: TMF630@5.0.0/P1/9.4/task-204-no-representation
    source: TMF630 v5.0.0 P1 §9.4 p.147
    level: mandatory
    requirement: The server must answer a task operation with 204 No Content when the task completed and neither a task resource nor a result is returned.
    status: pending
    note: "gap: C10.1 defines no task that returns no content; applies only if one is added"
  - id: TMF630@5.0.0/P1/9.4/task-error-status-no-resource
    source: TMF630 v5.0.0 P1 §9.4 p.148
    level: mandatory
    requirement: When a task operation fails and no task resource was created, the server must return the appropriate error status.
    status: pending
    note: "C10.6: errors use the 3.8 status codes and the TMF Error body; a refused change set leaves nothing applied (Contracts 1.4)"
  - id: TMF630@5.0.0/P1/9.4/persisted-task-get-exposed
    source: TMF630 v5.0.0 P1 §9.4 p.148
    level: mandatory
    requirement: When a task resource is persisted (above all for long-running tasks), the API must offer a GET by the task resource's identifier.
    status: pending
    note: "C10.1: GET /api/v1/changeSet/{id}"
  - id: TMF630@5.0.0/P1/9.4/all-tasks-follow-lifecycle
    source: TMF630 v5.0.0 P1 §9.4 p.148
    level: mandatory
    requirement: Every task must follow the task lifecycle diagram (its state transitions and the status code for each path), with state as the lifecycle attribute.
    status: pending
    note: "gap: change-set states are STD's own (Contracts 1.4) and C10.1 maps no TMF task states"
  - id: TMF630@5.0.0/P1/9.5/cancellation-as-separate-task
    source: TMF630 v5.0.0 P1 §9.5 p.148
    level: recommended
    requirement: An API should model the cancellation of a long-running task as a separate task resource with its own lifecycle.
    status: pending
    note: "gap: a change set is resumed or abandoned through the CLI (std schema abandon, Contracts 1.4), not through a cancellation task resource in the API"
  - id: TMF630@5.0.0/P1/9.6/server-chooses-task-type
    source: TMF630 v5.0.0 P1 §9.6 p.151
    level: optional
    requirement: A server that supports both task variants may decide at runtime, for example from the request payload, whether to run a task as short- or long-running.
    status: pending
    note: "C10.1: each STD task resource has one fixed variant (formStateCheck short, changeSet persisted); the option is not used"
  - id: TMF630@5.0.0/P1/9.7/task-result-subresource-paging
    source: TMF630 v5.0.0 P1 §9.7 p.153
    level: optional
    requirement: A task whose result holds a large array may expose that array as a sub-resource collection, advertised with a Link header (rel="collection"), so clients can page over it.
    status: pending
    note: "gap: change-set steps come inside the change set (Contracts 1.4); no pageable task sub-resource is exposed"
  - id: TMF630@5.0.0/P1/9.7/task-subresource-paging-after-completion
    source: TMF630 v5.0.0 P1 §9.7 p.158
    level: optional
    requirement: The server may make paging over a task's sub-resources available only once the task has completed.
    status: pending
    note: "gap: STD exposes no task sub-resource collections"
  - id: TMF630@5.0.0/P1/10/async-use-monitor-or-notification
    source: TMF630 v5.0.0 P1 §10 p.164
    level: mandatory
    requirement: A server that supports asynchronous operations must report their progress through either the monitor pattern or the notification pattern.
    status: pending
    note: "gap: STD offers no asynchronous (202) operations; every operation completes within the request (C10.5)"
  - id: TMF630@5.0.0/P1/10/async-monitor-id-returned
    source: TMF630 v5.0.0 P1 §10 p.164
    level: mandatory
    requirement: When the monitor pattern is used, the server must create a monitor resource and return its ID so the client can check the operation's progress.
    status: pending
    note: "gap: STD has no monitor resource and no asynchronous operations"
  - id: TMF630@5.0.0/P1/10/async-return-id-href-type-or-monitor
    source: TMF630 v5.0.0 P1 §10 p.164
    level: mandatory
    requirement: An asynchronously accepted request must return at least either the id, href and @type of the resource or a monitor resource.
    status: pending
    note: "gap: STD has no asynchronous operations"
  - id: TMF630@5.0.0/P1/10/async-monitor-when-no-id
    source: TMF630 v5.0.0 P1 §10 p.164
    level: mandatory
    requirement: If the server cannot give the client an id and href for an asynchronous request, it must provide a monitor.
    status: pending
    note: "gap: STD has no asynchronous operations"
  - id: TMF630@5.0.0/P1/10.3/client-expect-202-for-async
    source: TMF630 v5.0.0 P1 §10.3 p.169
    level: mandatory
    requirement: A client asking for asynchronous handling must send the Expect header with the value 202 Accepted.
    status: pending
    note: "client-side: binds clients asking a producer for asynchronous handling; STD offers none"
  - id: TMF630@5.0.0/P1/10.3/client-expect-sync-code
    source: TMF630 v5.0.0 P1 §10.3 p.169
    level: mandatory
    requirement: A client asking for synchronous handling must send the Expect header with the operation's synchronous success code (for example 201 Created).
    status: pending
    note: "client-side: binds clients; STD handles every request synchronously anyway"
  - id: TMF630@5.0.0/P1/10.3/server-417-expectation-unmet
    source: TMF630 v5.0.0 P1 §10.3 p.170
    level: optional
    requirement: A server that receives an Expect header it cannot satisfy may answer 417 Expectation Failed.
    status: pending
    note: "gap: Contracts 10 says nothing about Expect; STD supports no asynchronous handling, and its answer to Expect: 202 Accepted is not specified (Node's HTTP server answers 417 to an unknown expectation unless the app handles it [unverified for STD])"
  - id: TMF630@5.0.0/P1/10.3/contradictory-sync-async-request-error
    source: TMF630 v5.0.0 P1 §10.3 p.171
    level: mandatory
    requirement: When a request asks for synchronous handling through a resource attribute but for asynchronous handling through Expect, the server must reject it with a suitable error (for example 409 Conflict).
    status: pending
    note: "gap: STD has no synchronous-response attributes and no asynchronous handling; Contracts 10 does not cover Expect"
  - id: TMF630@5.0.0/P1/10.3/migrate-to-expect-header
    source: TMF630 v5.0.0 P1 §10.3 p.171
    level: recommended
    requirement: Existing TMF Open APIs that select sync or async handling by other means should move to the Expect header in their next major version.
    status: pending
    note: "tmf-apis (C11): concerns the evolution of TM Forum's own Open APIs"
  - id: TMF630@5.0.0/P1/10.4/monitor-top-level-collection
    source: TMF630 v5.0.0 P1 §10.4 p.172
    level: mandatory
    requirement: An API that supports the monitor pattern must define a top-level resource collection named monitor.
    status: pending
    note: "gap: STD supports no monitor pattern and serves no /monitor collection"
  - id: TMF630@5.0.0/P1/10.4/monitor-created-per-long-task
    source: TMF630 v5.0.0 P1 §10.4 p.172
    level: mandatory
    requirement: Where monitoring is supported, the server must create a monitor resource instance for each long-running task that supports monitoring.
    status: pending
    note: "gap: STD has no monitor resources; a change set's progress is read on GET /api/v1/changeSet/{id} (C10.1)"
  - id: TMF630@5.0.0/P1/10.4/monitor-link-in-initiating-response
    source: TMF630 v5.0.0 P1 §10.4 p.172
    level: mandatory
    requirement: The response to the request that started a monitored long-running task must include a link to its monitor resource.
    status: pending
    note: "gap: STD has no monitor resources"
  - id: TMF630@5.0.0/P1/10.4/monitor-supports-get
    source: TMF630 v5.0.0 P1 §10.4 p.172
    level: mandatory
    requirement: The monitor resource must support GET so clients can query the task's status.
    status: pending
    note: "gap: STD has no monitor resources"
  - id: TMF630@5.0.0/P1/10.4/monitor-no-post-patch-delete
    source: TMF630 v5.0.0 P1 §10.4 p.172
    level: mandatory
