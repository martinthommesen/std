    requirement: A base Open API should cover generic business processes usable for any use case.
    status: pending
    note: "tmf-apis (C11): about TM Forum's base APIs"
  - id: TMF630@5.0.0/P8/principle-2/no-specialization-if-api-exists
    source: TMF630 v5.0.0 P8 §Principle 2 p.8
    level: recommended
    requirement: An operator should not need to specialize a TMF API for a context when that API already exists in its IT.
    status: pending
    note: "tmf-apis (C11): STD implements the pinned base APIs and publishes no specialized API"
  - id: TMF630@5.0.0/P8/principle-2/specialization-may-become-obsolete
    source: TMF630 v5.0.0 P8 §Principle 2 p.8
    level: optional
    requirement: A specialization may become obsolete once the base API absorbs its changes, and a context may need the standard base API instead of a specialization.
    status: pending
    note: "tmf-apis (C11): no specialized API in STD"
  - id: TMF630@5.0.0/P8/principle-4/multiple-specializations-together
    source: TMF630 v5.0.0 P8 §Principle 4 p.8
    level: optional
    requirement: Specializations of several APIs may be designed and used together, each separate but possibly reusing the same transforms.
    status: pending
    note: "tmf-apis (C11): no specialized API in STD"
  - id: TMF630@5.0.0/P8/principle-5/no-framework-specialization-implied
    source: TMF630 v5.0.0 P8 §Principle 5 p.9
    level: optional
    requirement: A specialization's specifics need not be standardized in the Information Framework, eTOM or Functional Framework unless they fill a gap useful to others.
    status: pending
    note: "tmf-apis (C11): no specialized API in STD"
  - id: TMF630@5.0.0/P8/principle-6/tmf-may-host-specialization
    source: TMF630 v5.0.0 P8 §Principle 6 p.9
    level: optional
    requirement: TM Forum may host a specialized API among the parent API's resources.
    status: pending
    note: "tmf-apis (C11): no specialized API in STD"
  - id: TMF630@5.0.0/P8/principle-7/parent-evolves-independently
    source: TMF630 v5.0.0 P8 §Principle 7 p.9
    level: optional
    requirement: A parent API may evolve without regard to its specializations.
    status: pending
    note: "tmf-apis (C11): STD pins parent versions and moves a pin in its own PR (11.1)"
  - id: TMF630@5.0.0/P8/principle-8/specialization-may-be-deprecated
    source: TMF630 v5.0.0 P8 §Principle 8 p.9
    level: optional
    requirement: A specialized API may be deprecated when unused or ownerless.
    status: pending
    note: "tmf-apis (C11): no specialized API in STD"
  - id: TMF630@5.0.0/P8/principle-9/choice-of-extension-pattern
    source: TMF630 v5.0.0 P8 §Principle 9 p.9
    level: recommended
    requirement: A specialized API should be able to choose between the characteristic-based (name/value) and the schema-based (strongly typed subclass) extension pattern.
    status: pending
    note: "tmf-apis (C11): STD offers both on its TMF APIs: typed local child classes via `@type`/`@schemaLocation`, and characteristic arrays kept in json"
  - id: TMF630@5.0.0/P8/principle-10/specific-conformance-profile-optional
    source: TMF630 v5.0.0 P8 §Principle 10 p.10
    level: optional
    requirement: A specialized API may need its own conformance profile and CTK, specializing the parent's with extra constraints; otherwise the parent's apply.
    status: pending
    note: "tmf-apis (C11): STD runs the parent APIs' pinned CTKs (11.1 table)"
  - id: TMF630@5.0.0/P8/rule-1/avoid-specialization-if-docs-suffice
    source: TMF630 v5.0.0 P8 §Rule 1 p.11
    level: recommended
    requirement: Before specializing, a study should check whether the base API plus context-specific documentation is enough, and specialization should then be avoided.
    status: pending
    note: "tmf-apis (C11): STD serves base APIs and documents its mappings (conformance notes)"
  - id: TMF630@5.0.0/P8/rule-2/propose-extensions-upstream
    source: TMF630 v5.0.0 P8 §Rule 2 p.11
    level: recommended
    requirement: Extensions of wider use made in a specialized API should be proposed for inclusion in the parent API.
    status: pending
    note: "tmf-apis (C11): STD's local child classes are installation-specific; no upstream process is defined"
  - id: TMF630@5.0.0/P8/rule-2/extensions-traced-visible
    source: TMF630 v5.0.0 P8 §Rule 2 p.11
    level: mandatory
    requirement: Every extension is traced and made visible so that other specializers can reuse it.
    status: pending
    note: "tmf-apis (C11): a local child class's additions are published as its JSON Schema, named by `@schemaLocation` (`/api/v1/tableMetadata/{class}/schema.json`, C10.2)"
  - id: TMF630@5.0.0/P8/rule-3/keep-required-attributes
    source: TMF630 v5.0.0 P8 §Rule 3 p.11
    level: mandatory
    requirement: A specialized API keeps every attribute the parent requires, and the request/response models of the operations it keeps stay compatible with the parent's.
    status: pending
    note: "tmf-apis (C11): a local child class's schema adds its attributes to the pinned TMF schema without removing any"
  - id: TMF630@5.0.0/P8/rule-4/pass-parent-ctk
    source: TMF630 v5.0.0 P8 §Rule 4 p.11
    level: mandatory
    requirement: An implementation of a specialized API passes its parent API's CTK, and hence the base API's CTK.
    status: pending
    note: "tmf-apis (C11): each pinned API is gated on its kit (11.1 table); unsupported resources such as `troubleTicketSpecification` are recorded gaps (E20-resources-not-served)"
  - id: TMF630@5.0.0/P8/rule-5/may-reduce-parent
    source: TMF630 v5.0.0 P8 §Rule 5 p.11
    level: optional
    requirement: "A specialized API may reduce its parent: omit operations (even required ones) or optional attributes, or constrain open strings with an enum, a format or validators."
    status: pending
    note: "tmf-apis (C11): STD omits some resources (E20-resources-not-served) and never shows some states (E21-order-events-and-cancellation-states)"
  - id: TMF630@5.0.0/P8/rule-5/no-enum-value-removal
    source: TMF630 v5.0.0 P8 §Rule 5 p.12
    level: mandatory
    requirement: A specialized API does not remove values from an attribute the parent defines as an enum. (no keyword; stated as the pattern)
    status: pending
    note: "tmf-apis (C11): STD serves the pinned enums unchanged; states it never produces (E21) stay in the schema"
  - id: TMF630@5.0.0/P8/rule-6/may-extend-parent
    source: TMF630 v5.0.0 P8 §Rule 6 p.12
    level: optional
    requirement: "A specialized API may extend its parent: make optional attributes required, add attributes, endpoints or operations, rewrite attribute descriptions or examples."
    status: pending
    note: "tmf-apis (C11): local child classes add attributes through `@type`/`@schemaLocation`"
  - id: TMF630@5.0.0/P8/rule-6/backward-compatible-with-parent
    source: TMF630 v5.0.0 P8 §Rule 6 p.12
    level: mandatory
    requirement: A specialized API stays backward compatible with its parent (the reverse is not required).
    status: pending
    note: "tmf-apis (C11): a local child-class resource is a valid instance of the pinned TMF type plus extra attributes"
  - id: TMF630@5.0.0/P8/rule-6/no-enum-value-addition
    source: TMF630 v5.0.0 P8 §Rule 6 p.12
    level: mandatory
    requirement: A specialized API does not add values to an attribute the parent defines as an enum; it adds a new attribute instead. (no keyword; stated as the pattern)
    status: pending
    note: "tmf-apis (C11): mapping tables translate STD states to the pinned enum values only (e.g. TMF641/TMF622 state maps)"
  - id: TMF630@5.0.0/P8/rule-6/study-new-endpoints
    source: TMF630 v5.0.0 P8 §Rule 6 p.12
    level: recommended
    requirement: Adding endpoints or operations to a parent API should be studied carefully to avoid endpoint proliferation and drift between specializations.
    status: pending
    note: "tmf-apis (C11): STD's TMF APIs add no endpoints beyond the pinned documents"
  - id: TMF630@5.0.0/P8/rule-7/keep-endpoint-names
    source: TMF630 v5.0.0 P8 §Rule 7 p.12
    level: mandatory
    requirement: A specialized API keeps the parent's endpoint names; context is expressed through @type polymorphism.
    status: pending
    note: "tmf-apis (C11): STD serves the pinned base paths and resource names; local classes appear through `@type` on the same endpoints"
  - id: TMF630@5.0.0/P8/rule-8/no-attribute-meaning-change
    source: TMF630 v5.0.0 P8 §Rule 8 p.13
    level: mandatory
    requirement: A specialized API does not reuse a parent attribute name for a different functional meaning.
    status: pending
    note: "C10.2: a local child class cannot define an attribute whose API name clashes with an inherited one (`apiNameClash`)"
  - id: TMF630@5.0.0/P8/rule-8/attribute-meaning-from-sid
    source: TMF630 v5.0.0 P8 §Rule 8 p.13
    level: recommended
    requirement: An attribute's functional meaning should come from an Information Framework (SID) ABE where one applies.
    status: pending
    note: "tmf-apis (C11): mapping tables follow the pinned TMF attributes"
  - id: TMF630@5.0.0/P8/rule-8/redefine-same-meaning-optional
    source: TMF630 v5.0.0 P8 §Rule 8 p.13
    level: optional
    requirement: A specialized API may redefine a parent attribute under the same name for the same meaning (e.g. new description or added format), sparingly.
    status: pending
    note: "tmf-apis (C11): STD does not redefine pinned attributes"
  - id: TMF630@5.0.0/P8/rule-9/no-incompatible-type-change
    source: TMF630 v5.0.0 P8 §Rule 9 p.13
    level: mandatory
    requirement: A specialized API does not change a parent attribute's type in a backward-incompatible way (e.g. string to integer).
    status: pending
    note: "tmf-apis (C11): mappings render pinned types (big integers and decimals as the pinned schema's types)"
  - id: TMF630@5.0.0/P8/rule-10/change-referred-schema
    source: TMF630 v5.0.0 P8 §Rule 10 p.13
    level: optional
    requirement: A specialized API may change the schema an attribute refers to (extending or reducing it, or its oneOf list), provided all required attributes of at least one referred schema stay required.
    status: pending
    note: "tmf-apis (C11): STD keeps the pinned referred schemas"
  - id: TMF630@5.0.0/P8/rule-oa1/reuse-tmf-frameworks
    source: TMF630 v5.0.0 P8 §Rule OA1 p.16
    level: mandatory
    requirement: An officially approved specialized API builds on the main TM Forum frameworks (ODA, Information Framework) and reuses their concepts, entities and schemas.
    status: pending
    note: "tmf-apis (C11): applies only to specialized APIs published as TM Forum assets; STD publishes none"
  - id: TMF630@5.0.0/P8/rule-oa2/api-profile-approved-first
    source: TMF630 v5.0.0 P8 §Rule OA2 p.16
    level: mandatory
    requirement: An officially approved specialized API has its API Profile (justifying every change from the parent) approved before it is specified.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa3/compliant-with-tmf630
    source: TMF630 v5.0.0 P8 §Rule OA3 p.16
    level: mandatory
    requirement: An officially approved specialized API complies with the TMF630 Design Guidelines.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa3/approved-by-stakeholders
    source: TMF630 v5.0.0 P8 §Rule OA3 p.16
    level: mandatory
    requirement: An officially approved specialized API is approved by TM Forum stakeholders.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa4/generated-with-tmf-tooling
    source: TMF630 v5.0.0 P8 §Rule OA4 p.16
    level: mandatory
    requirement: A specialized API meant as a TM Forum standard is generated with TM Forum's tooling.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa5/context-name-approved
    source: TMF630 v5.0.0 P8 §Rule OA5 p.16
    level: mandatory
    requirement: The context name and prefix of an officially approved specialized API are approved by TM Forum.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa6/keep-base-api-number
    source: TMF630 v5.0.0 P8 §Rule OA6 p.16
    level: mandatory
    requirement: An officially approved specialized API keeps its base API's TMF number (e.g. starts with TMF622).
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa6/own-number-without-ctk
    source: TMF630 v5.0.0 P8 §Rule OA6 p.16
    level: mandatory
    requirement: A specialization that does not satisfy Rule 4 (passing the parent CTK) gets its own TMF number instead.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa7/identifier-context-suffix
    source: TMF630 v5.0.0 P8 §Rule OA7 p.17
    level: mandatory
    requirement: An officially approved specialized API's identifier is the base identifier plus an underscore and the context's upper-case acronym (e.g. TMF622_WB).
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa8/name-context-suffix
    source: TMF630 v5.0.0 P8 §Rule OA8 p.17
    level: mandatory
    requirement: An officially approved specialized API's name is the base API name followed by the context's full name.
    status: pending
    note: "tmf-apis (C11): as above"
  - id: TMF630@5.0.0/P8/rule-oa9/schema-name-context-prefix
    source: TMF630 v5.0.0 P8 §Rule OA9 p.17
    level: mandatory
    requirement: In an officially approved specialized API, a specialized schema's name is the base schema name prefixed with the context's allocated prefix (also used as the @type value).
    status: pending
    note: "tmf-apis (C11): only for official TM Forum specializations; STD's local child classes use their qualified STD name as `@type` (C11.1)"
