# Requirements matrix (Contracts 15) for the TMF630 REST API Design
# Guidelines at the pinned version (packages/tmf/specs/pins.json).
#
# Baseline (Martin, 2026-10-22): v5.0.0 Parts 1 and 4 to 8 (Team Approved,
# pre-production), plus v4.0.0 Parts 2 and 3 from the v4.2.0 bundle, because
# v5 Parts 2 and 3 are unpublished. Rows paraphrase and cite (TM Forum member
# material: cited, never copied). One row per normative statement: RFC 8174
# keywords in v5; in the v4.0.0 parts, prescriptive sentences, and rules
# stated as the pattern without a keyword, which the requirement says. A row
# built from a lower-case keyword says so too.
#
# Each row's note says how STD's API relates to it: a Contracts
# section, an exclusion, client-side, spec-authoring (a rule for writing API
# documents; STD's served documents follow where the note says so), hubs
# (3H, Contracts 12), tmf-apis (Contracts 11) or gap; a CONTRADICTION with
# Contracts 10 is reported to Martin (decision 0025).
spec: TMF630
version: 5.0.0
title: REST API Design Guidelines (v5.0.0 Parts 1 and 4 to 8, v4.0.0 Parts 2 and 3)
sources:
  - id: P1
    document: TMF630 REST API Design Guidelines Part 1 (naming, CRUD, filtering, tasks, history, notifications)
    version: 5.0.0 (July 2026, pre-production, Team Approved 2025-09-04)
    licence: TM Forum member material; cited, never copied
    note: Page numbers are the document's own (Page N of 261).
  - id: P2
    document: TMF630 REST API Design Guidelines Part 2 (polymorphism, extension patterns, depth)
    version: 4.0.0 (from the v4.2.0 bundle; v5 Part 2 is unpublished)
    licence: TM Forum material; cited, never copied
    note: Page numbers are the printed ones.
  - id: P3
    document: TMF630 REST API Design Guidelines Part 3 (hypermedia)
    version: 4.0.0 (from the v4.2.0 bundle; v5 Part 3 is unpublished)
    licence: TM Forum material; cited, never copied
    note: Page numbers are the printed ones.
  - id: P4
    document: TMF630 REST API Design Guidelines Part 4 (import and export tasks, entity versioning)
    version: 5.0.0 (July 2026, pre-production)
    licence: TM Forum member material; cited, never copied
  - id: P5
    document: TMF630 REST API Design Guidelines Part 5 (JSON Patch extensions)
    version: 5.0.0 (July 2026, pre-production)
    licence: TM Forum member material; cited, never copied
  - id: P6
    document: TMF630 REST API Design Guidelines Part 6 (JSONPath)
    version: 5.0.0 (July 2026, pre-production)
    licence: TM Forum member material; cited, never copied
  - id: P7
    document: TMF630 REST API Design Guidelines Part 7 (JSON Schema patterns)
    version: 5.0.0 (July 2026, pre-production)
    licence: TM Forum member material; cited, never copied
  - id: P8
    document: TMF630 REST API Design Guidelines Part 8 (API specialization)
    version: 5.0.0 (July 2026, pre-production)
    licence: TM Forum member material; cited, never copied
rows:
  - id: TMF630@5.0.0/P1/1.1/one-archetype-per-resource
    source: TMF630 v5.0.0 P1 §1.1 p.9
    level: recommended
    requirement: "An API designer should give each resource exactly one archetype: managed resource, task resource, collection or child resource. (lowercase 'should' in source)"
    status: pending
    note: "C10.1: tables are managed resources with their collection; `formStateCheck` and `changeSet` are task resources; `/{id}/history` is a child collection"
  - id: TMF630@5.0.0/P1/1.2/richardson-level-2
    source: TMF630 v5.0.0 P1 §1.2 p.9
    level: mandatory
    requirement: Every API implements level 2 of the Richardson Maturity Model (resources addressed by URI, HTTP verbs and status codes used as defined); level 3 is not required. (lowercase 'must' in source)
    status: pending
    note: "C10.1: resources per table with GET, POST, PATCH, DELETE; status codes per 10.4 to 10.6"
  - id: TMF630@5.0.0/P1/1.3/spec-required-contents
    source: TMF630 v5.0.0 P1 §1.3 p.10
    level: mandatory
    requirement: Each API specification states the API's purpose, resource and API URLs with version, supported HTTP verbs, JSON as representation, response schemas (and request schemas for POST and PATCH), supported links (optional at level 2) and supported response status codes.
    status: pending
    note: "spec-authoring: constrains STD's served `/api/v1/openapi.json` and per-table `tableMetadata/{table}/openapi.json` (C10.1, Contracts 6.3)"
  - id: TMF630@5.0.0/P1/1.3/spec-in-openapi-3
    source: TMF630 v5.0.0 P1 §1.3 p.10
    level: mandatory
    requirement: The API specification is written in OpenAPI 3.x.
    status: pending
    note: "spec-authoring: STD generates OpenAPI 3.1 for `/api/v1/openapi.json` and per-table documents (C10.1, Contracts 6.1, 6.3)"
  - id: TMF630@5.0.0/P1/1.5.1/caching-headers-when-caching
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: recommended
    requirement: When responses are to be cached, the server should use Cache-Control, Expires and Date as RFC 9111 defines them.
    status: pending
    note: "C10.1: STD's API responses are never cacheable (`Cache-Control: no-store`), so the case does not arise"
  - id: TMF630@5.0.0/P1/1.5.1/cache-discouraging-headers-allowed
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: optional
    requirement: The server may send Cache-Control and Expires to discourage caching, for example no-cache and no-store on a response that must not be cached.
    status: pending
    note: "C10.1: every `/api/` response carries `Cache-Control: no-store`"
  - id: TMF630@5.0.0/P1/1.5.1/caching-encouraged
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: recommended
    requirement: An API should encourage caching of its responses.
    status: excluded
    decision: X630-no-store
    note: "exclusion X630-no-store (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/P1/1.5.1/no-cache-only-when-necessary
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: recommended
    requirement: The server should not send the no-cache directive unless it is absolutely necessary.
    status: excluded
    decision: X630-no-store
    note: "exclusion X630-no-store (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/P1/1.5.1/expiration-headers-on-get-200
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: recommended
    requirement: The server should send expiration caching headers on 200 responses to GET and HEAD.
    status: excluded
    decision: X630-no-store
    note: "exclusion X630-no-store (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/P1/1.5.1/expiration-headers-on-3xx-4xx
    source: TMF630 v5.0.0 P1 §1.5.1 p.11
    level: optional
    requirement: The server may send expiration caching headers on 3xx and 4xx responses to reduce redirect and error load.
    status: pending
    note: "gap: not used; every API response is `no-store` (C10.1)"
  - id: TMF630@5.0.0/P1/1.5.2/client-may-send-any-header
    source: TMF630 v5.0.0 P1 §1.5.2 p.11
    level: optional
    requirement: A client may send any header defined by RFC 9110, RFC 9111 or RFC 9112.
    status: pending
    note: "client-side: describes what a client may send"
  - id: TMF630@5.0.0/P1/1.5.2/client-expects-any-header
    source: TMF630 v5.0.0 P1 §1.5.2 p.11
    level: mandatory
    requirement: A client must cope with any header defined by RFC 9110, RFC 9111 or RFC 9112 in a response.
    status: pending
    note: "client-side: binds clients (STD's typed client and web app must tolerate unknown headers)"
  - id: TMF630@5.0.0/P1/1.5.2/client-uses-accept
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: A client states the media type it wants with the Accept header.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/accept-value-per-rfc9110
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: The Accept header value a client sends follows RFC 9110 syntax.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/client-supports-json
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: A client supports application/json as its default media type.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/utf8-charset
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: JSON exchanged outside a closed ecosystem is encoded in UTF-8, as RFC 8259 section 8.1 requires, so no charset parameter is needed.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
      - "packages/server/test/text-policy-http.test.ts#round-trips classified prose through generic/TMF writes, literals, notes and history"
    note: "P1 pp.12-13 applies to network JSON outside a closed ecosystem. Real TCP tests retain UTF-8 octets, compare an independent non-ASCII byte fixture, decode fatally, round-trip writes and errors, and count octets. Existing classified-prose coverage supplies combining marks and line endings. Empty HEAD/204 and defect responses carry no JSON payload; no charset spelling is required (RFC8259 §§8.1,11)."
  - id: TMF630@5.0.0/P1/1.5.2/no-accept-charset
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: recommended
    requirement: Clients should not send the (deprecated) Accept-Charset header.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/unsupported-accept-falls-back-to-json
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: When a client asks for a media type the server does not support, the server answers in application/json as if no Accept header had been sent. (lowercase 'must' in source)
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
    note: "P1 p.12: unsupported requested response media falls back to application/json, without 406. Current generic/fixed/definition/mapped/TMF621/TMF688/hub payload paths are JSON: raw TCP compares absent versus XML Accept and parses actual bodies. The named schema resource also emits application/json (jsonAnswer contentType wins over its header option). Resource-event full reads generate fresh eventTime independently of Accept; media is checked on both full reads and bytes compared with stable eventId/eventType projection. No new negotiation is implemented."
  - id: TMF630@5.0.0/P1/1.5.2/client-may-request-locale
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: optional
    requirement: A client may state the locale it wants for the response in a request header.
    status: pending
    note: "client-side: describes what a client may send"
  - id: TMF630@5.0.0/P1/1.5.2/client-uses-accept-language
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: recommended
    requirement: A client should state the locale with the Accept-Language header.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/accept-language-locale-pattern
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: The Accept-Language value has the form of an ISO 639 language code optionally followed by an underscore and an ISO 3166 alpha-2 country code (for example en_GB).
    status: pending
    note: "client-side: binds the value clients send (note: differs from RFC 9110's BCP 47 tags, which use a hyphen)"
  - id: TMF630@5.0.0/P1/1.5.2/client-expects-en-gb
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: A client expects en_GB as the default locale.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/unsupported-language-falls-back-to-en-gb
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: When a client asks for a language the server does not support, the server returns the payload in en_GB. (lowercase 'must' in source)
    status: pending
    note: "gap: STD has no locale negotiation; its fixed texts (error `reason` and `message`, labels) are in English whatever Accept-Language says (C10.6)"
  - id: TMF630@5.0.0/P1/1.5.2/server-may-send-any-header
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: optional
    requirement: A server may send any header defined by RFC 9110, RFC 9111 or RFC 9112.
    status: pending
    note: "C10.1: STD sends its own headers (`STD-Schema-Revision`, `Cache-Control`) beside the standard ones"
  - id: TMF630@5.0.0/P1/1.5.2/server-expects-any-header
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: A server must accept requests carrying any header defined by RFC 9110, RFC 9111 or RFC 9112.
    status: pending
    note: "gap: not stated in Contracts 10 (10.3 refuses unknown query parameters, not headers); needs a test that standard headers are tolerated"
  - id: TMF630@5.0.0/P1/1.5.2/server-states-response-media-type
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: recommended
    requirement: The server should state the response's media type in a response header.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
      - "packages/server/test/head-metadata.test.ts#generic and fixed HEAD paths preserve GET byte lengths, projections, masks and error metadata"
      - "packages/server/test/head-metadata.test.ts#mapped collection and resource HEAD preserve Unicode, selected and masked GET metadata and mapped errors"
      - "packages/server/test/head-metadata.test.ts#shipped TMF621 collection and resource HEAD retain GET metadata, projections and pinned errors"
      - "packages/server/test/head-metadata.test.ts#TCP HEAD carries the GET representation length and no bytes through the Node transport"
    note: "P1 pp.12-13 refers to actual response payload media. TCP success and typed-error tests parse Content-Type semantically and parse actual JSON across generic/fixed/definition/mapped/TMF621/TMF688/hub paths. HEAD metadata reuses existing exact tests; 204 has no payload media. Optional charset formatting is not pinned."
  - id: TMF630@5.0.0/P1/1.5.2/server-uses-content-type
    source: TMF630 v5.0.0 P1 §1.5.2 p.12
    level: mandatory
    requirement: The server states the response media type with the Content-Type header, whose value follows RFC 9110.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
      - "packages/server/test/head-metadata.test.ts#generic and fixed HEAD paths preserve GET byte lengths, projections, masks and error metadata"
      - "packages/server/test/head-metadata.test.ts#mapped collection and resource HEAD preserve Unicode, selected and masked GET metadata and mapped errors"
      - "packages/server/test/head-metadata.test.ts#shipped TMF621 collection and resource HEAD retain GET metadata, projections and pinned errors"
      - "packages/server/test/head-metadata.test.ts#TCP HEAD carries the GET representation length and no bytes through the Node transport"
    note: "P1 p.12 requires the Content-Type response field to identify actual media with RFC9110 syntax. TCP tests parse the field as MIMEType and actual UTF-8 JSON for all current response constructors and route families; existing HEAD tests retain GET metadata. Empty 204 has no content type. Plain JSON with/without UTF-8 charset and the offered patch formats are request media, not response media."
  - id: TMF630@5.0.0/P1/1.5.2/server-supports-json
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: mandatory
    requirement: The server supports application/json as its default media type, returned when asked for or when no Accept header is sent.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: every representation is a JSON object or array"
  - id: TMF630@5.0.0/P1/1.5.2/server-echoes-content-type
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: The server should send the Content-Type back so the client need not guess the media type.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
      - "packages/server/test/head-metadata.test.ts#generic and fixed HEAD paths preserve GET byte lengths, projections, masks and error metadata"
      - "packages/server/test/head-metadata.test.ts#mapped collection and resource HEAD preserve Unicode, selected and masked GET metadata and mapped errors"
      - "packages/server/test/head-metadata.test.ts#shipped TMF621 collection and resource HEAD retain GET metadata, projections and pinned errors"
      - "packages/server/test/head-metadata.test.ts#TCP HEAD carries the GET representation length and no bytes through the Node transport"
    note: "P1 p.13 says the server should provide its actual media header back so clients do not detect the payload type; this is not a requirement to echo request Content-Type. Real generic/definition/mapped/TMF621 PATCH success and typed errors answer application/json for plain JSON, merge-patch and offered JSON Patch inputs; refused formats likewise return JSON errors. Current read/fixed/hub/event paths and HEAD metadata are covered."
  - id: TMF630@5.0.0/P1/1.5.2/client-assumes-requested-or-default
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: A client should assume the response is in the media type it asked for or in the default.
    status: pending
    note: "client-side: binds clients"
  - id: TMF630@5.0.0/P1/1.5.2/server-content-length
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: The server should send Content-Length, so a client can check it read the whole body and learn a body's size with HEAD.
    status: pending
    note: "C10.1: head-metadata proves offered generic/fixed/mapped HEAD retains GET byte lengths, including UTF8, projections, masks and errors over web and TCP transports. The broader server Content-Length recommendation remains pending; unknown stream lengths are not synthesized."
  - id: TMF630@5.0.0/P1/1.5.2/server-last-modified
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: The server should send a Last-Modified header giving the resource's timestamp.
    status: pending
    note: "gap: STD exposes `updatedAt` in the body (C10.2) but sends no Last-Modified header"
  - id: TMF630@5.0.0/P1/1.5.2/server-etag
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: The server should send an ETag that changes whenever the representation changes; for a list response the ETag covers the whole response.
    status: pending
    note: 'C10.5: `ETag: "<version>"` on every single-resource response; gap: list responses (C10.4) carry no ETag'
  - id: TMF630@5.0.0/P1/1.5.2/location-on-create
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: mandatory
    requirement: The server gives the URI of a newly created resource in the Location header.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `POST /api/v1/{table}` returns `201` with `Location`"
  - id: TMF630@5.0.0/P1/1.5.2/server-may-state-locale
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: optional
    requirement: The server may state the response's locale in a response header.
    status: pending
    note: "gap: STD states no locale"
  - id: TMF630@5.0.0/P1/1.5.2/server-uses-content-language
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: recommended
    requirement: The server should state the locale with the Content-Language header.
    status: pending
    note: "gap: STD sends no Content-Language"
  - id: TMF630@5.0.0/P1/1.5.2/content-language-locale-pattern
    source: TMF630 v5.0.0 P1 §1.5.2 p.13
    level: mandatory
    requirement: A Content-Language value has the form of an ISO 639 language code optionally followed by an underscore and an ISO 3166 alpha-2 country code.
    status: pending
    note: "gap: STD sends no Content-Language (if added, note the underscore form differs from RFC 9110's BCP 47 tags)"
  - id: TMF630@5.0.0/P1/1.5.2/server-supports-en-gb
    source: TMF630 v5.0.0 P1 §1.5.2 p.14
    level: mandatory
    requirement: The server supports en_GB as its default locale.
    status: pending
    note: "gap: STD's fixed texts are English but no locale is declared or negotiated"
  - id: TMF630@5.0.0/P1/1.5.2/supported-locales-documented
    source: TMF630 v5.0.0 P1 §1.5.2 p.14
    level: mandatory
    requirement: The locales an API supports are documented.
    status: pending
    note: "spec-authoring: STD's OpenAPI documents (C10.1) would have to state the single locale; gap: not stated today"
  - id: TMF630@5.0.0/P1/1.5.3/optimistic-locking-etag-if-match
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: recommended
    requirement: An implementation should prevent lost updates by optimistic locking with ETag and If-Match.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
      - packages/server/test/json-patch-race.test.ts#json-patch-race
    note: 'C10.5: version checks with `If-Match: "<version>"` and `ETag`'
  - id: TMF630@5.0.0/P1/1.5.3/etag-on-representation
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: Whenever the server returns a resource's state, it includes an entity tag in the ETag header.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: 'C10.5: every single-resource response carries `ETag: "<version>"`; gap: resources inside list responses have only `version` in the body'
  - id: TMF630@5.0.0/P1/1.5.3/etag-identifies-state
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: The ETag value uniquely identifies the resource's state at the time of the response.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: the ETag is the record `version`, incremented by every save (Contracts 6.7)"
  - id: TMF630@5.0.0/P1/1.5.3/etag-stable-until-modified
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: The ETag value does not change until the resource is modified.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: the version changes only on a save"
  - id: TMF630@5.0.0/P1/1.5.3/client-sends-if-match
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: A client requesting a change (POST, PATCH or DELETE) sends the entity tag it holds in If-Match.
    status: pending
    note: "client-side: binds clients; STD enforces it for PATCH and DELETE (C10.5); a create has no prior entity tag"
  - id: TMF630@5.0.0/P1/1.5.3/missing-if-match-428
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: The server rejects a change request without If-Match with 428 Precondition Required.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `428 VersionRequired` on PATCH and DELETE of the generic API; gap: TMF Open APIs keep If-Match optional (Contracts 11.1), and POST needs none"
  - id: TMF630@5.0.0/P1/1.5.3/server-checks-if-match
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: The server compares the If-Match value with the resource's current entity tag.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: the save pipeline checks the version after locking the root row (Contracts 4.1 step 2)"
  - id: TMF630@5.0.0/P1/1.5.3/if-match-mismatch-412
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: When If-Match does not match the current entity tag, the server rejects the request with 412 Precondition Failed.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5 (Martin 2026-10-22, M2): a stale If-Match is 412 with the current ETag."
  - id: TMF630@5.0.0/P1/1.5.3/if-match-mismatch-returns-current-etag
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: On an If-Match mismatch the server returns the resource's current entity tag in the ETag header of the error response.
    status: pending
    note: "gap: `VersionConflict` gives `currentVersion` in the body (C10.6); no ETag header is promised on the error"
  - id: TMF630@5.0.0/P1/1.5.3/if-match-match-applies-change
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: When If-Match matches, the server processes the request as if no precondition were used, updates the resource and gives it a new entity tag.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: a matching version proceeds through the save pipeline and increments `version`"
  - id: TMF630@5.0.0/P1/1.5.3/new-etag-returned
    source: TMF630 v5.0.0 P1 §1.5.3 p.14
    level: mandatory
    requirement: After a successful conditional change, the server returns the new entity tag in the ETag header.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: 'C10.5: `PATCH` returns `200` with `ETag: "<version>"`; a `DELETE` (`204`) has no new state'
  - id: TMF630@5.0.0/P1/1.5.4/rate-limit-defined
    source: TMF630 v5.0.0 P1 §1.5.4 p.14
    level: recommended
    requirement: The server should define a rate limit (per user or per application) of requests per time window.
    status: pending
    note: "gap: STD has no rate limiting"
  - id: TMF630@5.0.0/P1/1.5.4/rate-limit-429
    source: TMF630 v5.0.0 P1 §1.5.4 p.14
    level: recommended
    requirement: The server should answer 429 Too Many Requests when a client exceeds the limit.
    status: pending
    note: "gap: STD has no rate limiting and no 429 in Contracts 3.8"
  - id: TMF630@5.0.0/P1/1.5.4/rate-limit-headers
    source: TMF630 v5.0.0 P1 §1.5.4 p.14
    level: recommended
    requirement: The server should send X-Rate-Limit-Limit, X-Rate-Limit-Remaining and X-Rate-Limit-Reset giving the allowance, what is left and the seconds until the window resets.
    status: pending
    note: "gap: STD has no rate limiting"
  - id: TMF630@5.0.0/P1/1.5.5/x-total-count-on-list
    source: TMF630 v5.0.0 P1 §1.5.5 p.15
    level: recommended
    requirement: The server should send X-Total-Count on responses to a GET of a collection.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.4: `X-Total-Count` on every list unless the STD extension `count=false` drops it (exclusion E19-generic-api-extensions)"
  - id: TMF630@5.0.0/P1/1.5.5/x-total-count-is-total-matching
    source: TMF630 v5.0.0 P1 §1.5.5 p.15
    level: mandatory
    requirement: The X-Total-Count value is the total number of resources matching the GET, not the page size. (lowercase 'must' in source)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.4: computed with the page's `FROM` and `WHERE` (Contracts 3.5)"
  - id: TMF630@5.0.0/P1/1.6/apis-secured-least-privilege
    source: TMF630 v5.0.0 P1 §1.6 p.15
    level: recommended
    requirement: Every API should be secured against unauthorized access, following least privilege. (lowercase 'should' in source)
    status: tested
    tests:
      - packages/server/test/contracts3.test.ts#contracts3
    note: "C10.1: every resource except session creation needs a session (`401 Unauthenticated`, Contracts 3.8); access rules decide rows and fields (Contracts 3)"
  - id: TMF630@5.0.0/P1/2.1/entity-schemas-in-spec
    source: TMF630 v5.0.0 P1 §2.1 p.20
    level: mandatory
    requirement: The API specification contains schema definitions mapping each managed entity type to its resource model.
    status: pending
    note: "spec-authoring: constrains the per-table OpenAPI and JSON Schema documents STD serves (`tableMetadata/{table}/openapi.json`, `schema.json`, C10.1)"
  - id: TMF630@5.0.0/P1/2.1/resource-has-id
    source: TMF630 v5.0.0 P1 §2.1 p.20
    level: mandatory
    requirement: Each individual managed resource has a unique identifier attribute named id.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: `id` always present (UUID)"
  - id: TMF630@5.0.0/P1/2.3/uri-syntax-for-identifiers
    source: TMF630 v5.0.0 P1 §2.3 p.20
    level: recommended
    requirement: Resource identifiers should use the Web's URI syntax.
    status: pending
    note: "C10.1: resources are addressed as `/api/v1/{table}/{id}`; `href` is an absolute URL (C10.2)"
  - id: TMF630@5.0.0/P1/2.3/no-encoded-characters-in-uri
    source: TMF630 v5.0.0 P1 §2.3 p.20
    level: mandatory
    requirement: URIs must not contain characters that need percent-encoding.
    status: pending
    note: "C10.1: paths use table qualified names (letters, digits, underscore, one dot) and UUIDs; gap: the rule is not checked for admin-chosen table names"
  - id: TMF630@5.0.0/P1/2.3/resource-uri-pattern
    source: TMF630 v5.0.0 P1 §2.3 p.21
    level: recommended
    requirement: A resource URI should be the API root (the specification's servers.url) followed by the resource path of alternating resource names and IDs, ending in a resource or task name with optional ID.
    status: pending
    note: "C10.1: `{apiRoot}` is `/api/v1`, then `{table}[/{id}]` or a fixed resource"
  - id: TMF630@5.0.0/P1/2.3/https-scheme
    source: TMF630 v5.0.0 P1 §2.3 p.21
    level: recommended
    requirement: Every API should be served over HTTPS.
    status: pending
    note: "gap: Contracts 10 does not require TLS; it is left to the deployment (only the session cookie's `Secure` flag assumes it, architecture Sessions)"
  - id: TMF630@5.0.0/P1/2.4/mandatory-id-href-type
    source: TMF630 v5.0.0 P1 §2.4 p.21
    level: mandatory
    requirement: Every resource carries id (unique within its collection), href (its URI, full or relative, as given in Location) and @type (its class name).
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: `id`, `href` (absolute URL) and `@type` always present"
  - id: TMF630@5.0.0/P1/2.4/id-immutable-unique-never-reused
    source: TMF630 v5.0.0 P1 §2.4 p.22
    level: mandatory
    requirement: A resource id never changes, is unique within its collection and is never reused for another resource of that collection. (lowercase 'must' in source)
    status: pending
    note: "C10.2: record ids are UUIDv7, never reused (Contracts 1.1); `id` is read-only (C10.5)"
  - id: TMF630@5.0.0/P1/2.4.1/id-high-entropy
    source: TMF630 v5.0.0 P1 §2.4.1 p.22
    level: recommended
    requirement: The server should draw ids from a large random space so that known ids do not let anyone compute or guess others.
    status: pending
    note: "C10.2: UUIDv7 ids carry random bits after a timestamp prefix (Contracts 1.1; the creation-time leak is accepted in Contracts 3.6)"
  - id: TMF630@5.0.0/P1/2.5/resource-names-are-nouns
    source: TMF630 v5.0.0 P1 §2.5 p.22
    level: mandatory
    requirement: Managed resource names and collection names are nouns.
    status: pending
    note: "C10.1: fixed resources are nouns (`session`, `hub`, `tableMetadata`); gap: admin-chosen table names are not checked"
  - id: TMF630@5.0.0/P1/2.5/task-names-are-verbs
    source: TMF630 v5.0.0 P1 §2.5 p.22
    level: recommended
    requirement: Task resource names should be verbs or start with a verb.
    status: pending
    note: "gap: STD's task resources are named `formStateCheck` and `changeSet` (C10.1) CONTRADICTION: TMF630 v5.0.0 P1 §2.5 p.22 says task resource names should be or start with a verb; Contracts 10.1 names its task resources `formStateCheck` and `changeSet`, which are nouns."
  - id: TMF630@5.0.0/P1/2.5/managed-resource-upper-camel-case
    source: TMF630 v5.0.0 P1 §2.5 p.22
    level: mandatory
    requirement: Managed resource (type) names are UpperCamelCase, such as TroubleTicket.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2 (Martin 2026-10-22, M3): @type is the table's type name in UpperCamelCase (HelpdeskIncident)."
  - id: TMF630@5.0.0/P1/2.5/task-names-lower-camel-case
    source: TMF630 v5.0.0 P1 §2.5 p.22
    level: mandatory
    requirement: Task resource names are lowerCamelCase.
    status: pending
    note: "C10.1: `formStateCheck`, `changeSet`"
  - id: TMF630@5.0.0/P1/2.5/uri-names-lower-camel-case
    source: TMF630 v5.0.0 P1 §2.5 p.22
    level: mandatory
    requirement: Every name in a URI (resources, collections, child resources, tasks) is lowerCamelCase.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.1 (Martin 2026-10-22, M3): a table's collection is its API name in lowerCamelCase (helpdeskIncident)."
  - id: TMF630@5.0.0/P1/2.5/property-names-lower-camel-case
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: Resource property names are lowerCamelCase.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: API names turn each `_x` into `X`; clashes refused with `apiNameClash`"
  - id: TMF630@5.0.0/P1/2.5/no-implementation-details-in-names
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: Resource names do not expose technical or implementation details.
    status: pending
    note: "gap: `/api/v1/{table}` uses the qualified name, which is also the Postgres schema and table name (Contracts 1.1, C10.1)"
  - id: TMF630@5.0.0/P1/2.5/no-abbreviation-as-name
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: An abbreviation is never the whole name of a resource.
    status: pending
    note: "gap: fixed resources comply; admin-chosen table names are not checked"
  - id: TMF630@5.0.0/P1/2.5/abbreviation-only-when-too-long
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: recommended
    requirement: An abbreviation should appear inside a name only when the full name would be too long.
    status: pending
    note: "gap: admin-chosen table and field names are not checked"
  - id: TMF630@5.0.0/P1/2.5/abbreviation-uniform
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: An abbreviation, once used, is used the same way everywhere.
    status: pending
    note: "gap: admin-chosen table and field names are not checked"
  - id: TMF630@5.0.0/P1/2.5/no-acronym-as-name
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: An acronym is never the whole name of a resource; a well-known acronym may appear inside one.
    status: pending
    note: "gap: admin-chosen table names are not checked"
  - id: TMF630@5.0.0/P1/2.5/acronym-camel-case
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: An acronym inside a name is written in camel case (CdrTransaction, not CDRTransaction).
    status: pending
    note: "C10.2: API names come from snake_case definition names, so `cdr_x` gives `cdrX`; gap: `@type` keeps the qualified name"
  - id: TMF630@5.0.0/P1/2.5/names-from-sid
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: mandatory
    requirement: API resource names are derived from the TM Forum Information Framework (SID).
    status: pending
    note: "tmf-apis (C11): STD's generic resources are admin-defined tables, not SID entities; the TMF Open API mappings use TM Forum's names"
  - id: TMF630@5.0.0/P1/2.5/sid-abbreviations-spelled-out
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: recommended
    requirement: Where the SID abbreviates a name, the API resource name should use the full word.
    status: pending
    note: "tmf-apis (C11): only meaningful for SID-derived names"
  - id: TMF630@5.0.0/P1/2.5/no-meaningless-words
    source: TMF630 v5.0.0 P1 §2.5 p.23
    level: recommended
    requirement: Resource URIs should not contain filler words such as Management, Maintenance or Provision (ResourcePool, not ResourcePoolManagement).
    status: pending
    note: "gap: fixed resources comply; admin-chosen table names are not checked"
  - id: TMF630@5.0.0/P1/2.6/no-http-verbs-in-uri
    source: TMF630 v5.0.0 P1 §2.6 p.23
    level: mandatory
    requirement: URI names never contain HTTP method names; a task resource is used where clarity needs one.
    status: pending
    note: "C10.1: fixed paths contain no method names; gap: admin-chosen table names are not checked"
  - id: TMF630@5.0.0/P1/2.7/no-collection-postfix
    source: TMF630 v5.0.0 P1 §2.7 p.23
    level: mandatory
    requirement: Collection names carry no 'Collection' suffix; the resource name itself denotes the collection.
    status: pending
    note: "C10.1: `/api/v1/{table}` is the collection"
  - id: TMF630@5.0.0/P1/2.8/datetime-rfc3339
    source: TMF630 v5.0.0 P1 §2.8 p.24
    level: mandatory
    requirement: Every date-time attribute in a data model is specified in the RFC 3339 (section 5.6) format.
    status: pending
    note: "C10.2: date-times are written `YYYY-MM-DDTHH:mm:ss.sssZ` and read as RFC 3339 with `Z` or an offset (Contracts 6.5); gap: STD refuses the leap second `:60`"
  - id: TMF630@5.0.0/P1/2.8/datetime-offset-given
    source: TMF630 v5.0.0 P1 §2.8 p.25
    level: recommended
    requirement: Every date-time value should carry its UTC offset; a value without one is taken as local time per ISO 8601. (lowercase 'recommended' in source)
    status: pending
    note: "C10.2: STD always writes `Z` and refuses an input without `Z` or offset (Contracts 6.5) rather than reading it as local time"
  - id: TMF630@5.0.0/P1/3.1/no-method-tunnelling
    source: TMF630 v5.0.0 P1 §3.1 p.26
    level: mandatory
    requirement: API specifications do not use GET or POST to tunnel other methods; POST on task resources is the only exception (repeated in the operations table on p.27).
    status: pending
    note: "C10.1: POST is used only to create records and on the task resources `formStateCheck`, `changeSet` and `session`"
  - id: TMF630@5.0.0/P1/3.1/head-metadata-only
    source: TMF630 v5.0.0 P1 §3.1 p.26
    level: optional
    requirement: A server may support HEAD, but only to return response metadata as RFC 9110 defines; HEAD must not be used for anything else.
    status: tested
    tests:
      - packages/server/test/api-review-2.test.ts#api-review-2
      - packages/server/test/head-metadata.test.ts#head-metadata
    note: "C10.5: HEAD is offered wherever GET is and answers GET's status and headers without a body; OPTIONS is 204 with Allow."
  - id: TMF630@5.0.0/P1/3.1/get-by-id-retrieves-resource
    source: TMF630 v5.0.0 P1 §3.1 p.26
    level: mandatory
    requirement: Retrieving one managed resource is a GET on the resource URI ending in its id.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.1: `GET /api/v1/{table}/{id}`"
  - id: TMF630@5.0.0/P1/3.1/get-collection-queries
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: mandatory
    requirement: Querying entities is a GET on the collection resource, with query parameters.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.3: `GET /api/v1/{table}` with the 10.3 parameters"
  - id: TMF630@5.0.0/P1/3.1/post-collection-creates
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: mandatory
    requirement: Creating a resource is a POST on its collection resource.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `POST /api/v1/{table}`"
  - id: TMF630@5.0.0/P1/3.1/patch-partial-update
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: mandatory
    requirement: A partial update is a PATCH on the managed resource or on a collection resource.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `PATCH /api/v1/{table}/{id}`; gap: no PATCH on a collection"
  - id: TMF630@5.0.0/P1/3.1/delete-removes
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: mandatory
    requirement: Removing a resource is a DELETE on the managed resource.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `DELETE /api/v1/{table}/{id}`"
  - id: TMF630@5.0.0/P1/3.1/post-task-executes
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: mandatory
    requirement: An action on an entity is executed by a POST on a collection of task resources. (lowercase 'must' in source)
    status: pending
    note: "C10.1: `POST /api/v1/formStateCheck`, `POST /api/v1/changeSet`"
  - id: TMF630@5.0.0/P1/3.1/no-put
    source: TMF630 v5.0.0 P1 §3.1 p.27
    level: recommended
    requirement: PUT is not defined for TM Forum APIs and should not be used.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `PUT` is `405`"
  - id: TMF630@5.0.0/P1/3.2/json-default-representation
    source: TMF630 v5.0.0 P1 §3.2 p.27
    level: mandatory
    requirement: Every API supports application/json and uses JSON as its default resource representation (stated three times in 3.2).
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: every representation is JSON"
  - id: TMF630@5.0.0/P1/3.2/media-type-via-accept-content-type-only
    source: TMF630 v5.0.0 P1 §3.2 p.27
    level: mandatory
    requirement: An API controls the media type only through the Accept and Content-Type headers.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
    note: "P1 §3.2 p.27 controls representation media via Accept/Content-Type only. TCP read matrices cover rejected or ignored format/$format/_format/output/callback queries, rejected .xml/.json suffixes, and unchanged JSON with X-Format/X-Response-Format across current generic/fixed/definition/mapped/TMF621/hub/TMF688 families. PATCH MIME selects input syntax only; output stays JSON. Named OpenAPI/schema documents are separate resources, not suffix representations. Source response constructors and query/route dispatch contain no alternate selector."
  - id: TMF630@5.0.0/P1/3.2/no-other-media-type-mechanisms
    source: TMF630 v5.0.0 P1 §3.2 p.27
    level: recommended
    requirement: An API should not offer any other mechanism (such as a query parameter or file extension) to choose the media type.
    status: tested
    tests:
      - "packages/server/test/http-media.test.ts#JSON success and error constructors expose their actual representation media"
      - "packages/server/test/http-media.test.ts#generic writes exchange UTF-8 octets and return JSON for every offered PATCH MIME and its errors"
      - "packages/server/test/http-media.test.ts#generic and fixed resource variants identify their payload media and unsupported Accept keeps JSON bytes"
      - "packages/server/test/http-media.test.ts#definition writes return representation JSON rather than the merge-patch request MIME"
      - "packages/server/test/http-media.test.ts#mapped resources exchange Unicode JSON for plain, merge and JSON Patch requests including mapped errors"
      - "packages/server/test/http-media.test.ts#shipped TMF621 tickets and specifications declare JSON on reads, writes and pinned errors"
      - "packages/server/test/http-media.test.ts#generic, mapped and TMF688 hubs declare JSON for registrations, reads and errors"
      - "packages/server/test/http-media.test.ts#TMF688 topics and client events preserve UTF-8 JSON and ignore unsupported response media"
    note: "P1 §3.2 p.27 discourages other representation mechanisms. The same maintained read matrix proves queries, suffixes and custom format headers do not select alternative media across current route/query families, alongside source inventory of all response constructors and routing. Separate named schema/OpenAPI resources are not alternate formats of the record. No claim is made that these finite probes enumerate every possible HTTP header or client."
