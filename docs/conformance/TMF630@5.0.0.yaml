    note: "B2 proves authorized, filtered record and TMF621 navigation across bounded intervals and direction changes in packages/server/test/tmf-paging.test.ts. The broad row remains pending: separate event and dead-delivery cursor paths are not covered by this record-paging proof; no new exclusion is inferred."
