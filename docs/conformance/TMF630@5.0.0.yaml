    status: pending
    note: "Scoped evidence (packages/server/test/tmf-paging.test.ts#record range links preserve both exclusive bounds across three pages in both directions; packages/server/test/tmf-paging.test.ts#TMF621 range links preserve both bounds across three pages and filtered ends): the cited generic record and TMF621 HTTP tests retain both exclusive bounds across three forward/backward pages and direction changes, assert equal/reversed ranges empty, and retain filter-only totals. api-history-paging independently exercises bounded navigation and narrower ranges. Pending: decision 0037 also offers deadDelivery ranges, whose separate finishPage continuation loses the original upper bound; following next includes that exclusive endpoint (B2-R2 review reproduction). Repair and maintained deadDelivery range proof are a follow-up outside this focused fix. TMF688 events and offset-only topics/hubs do not offer combined cursors; no new exclusion is inferred."
  - id: TMF630@5.0.0/P1/4.5.6/filter-cursor-no-match-empty-array
