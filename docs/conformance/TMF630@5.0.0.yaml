    note: "gap: no TMF ImportJob; see import-status-succeeded"
  - id: TMF630@5.0.0/P4/2.1/import-table-status-failed
    source: TMF630 v5.0.0 P4 §2.1 p.19
    level: mandatory
    requirement: 'Attribute table restatement: the server must report "Failed" if any part of the import failed, whatever the extent.'
    status: pending
    note: "gap: no TMF ImportJob; C7.6 partial success differs, see import-status-failed-on-any-failure"
  - id: TMF630@5.0.0/P4/2.1/import-creation-date-in-response
    source: TMF630 v5.0.0 P4 §2.1 p.19
    level: recommended
    requirement: The server should include the system-generated `creationDate` of the import job in its responses.
    status: pending
    note: "gap: no TMF ImportJob"
  - id: TMF630@5.0.0/P4/2.1/import-completion-date-when-complete
    source: TMF630 v5.0.0 P4 §2.1 p.19
    level: recommended
    requirement: Once the import job is complete, the server should include the system-generated `completionDate` in its responses.
    status: pending
    note: "gap: no TMF ImportJob"
  - id: TMF630@5.0.0/P4/2.1/import-error-log-on-error
    source: TMF630 v5.0.0 P4 §2.1 p.19
    level: recommended
    requirement: When an error occurred, the server should include `errorLog` in the import job response.
    status: pending
    note: "gap: no TMF ImportJob; C7.6 row results and failed-rows file"
  - id: TMF630@5.0.0/P4/2.1/import-error-log-partial-detail
    source: TMF630 v5.0.0 P4 §2.1 p.19
    level: recommended
    requirement: When only part of an import failed, the server's error log should say which parts of the import data failed.
    status: pending
    note: "gap: no TMF ImportJob; C7.6 gives exactly one result per row with code, field and message"
  - id: TMF630@5.0.0/P4/2.2/import-only-previously-exported
    source: TMF630 v5.0.0 P4 §2.2 p.21
    level: recommended
    requirement: An import job should be used to bring back resources that were exported before.
    status: pending
    note: "gap: no TMF ImportJob; STD's import (C7) loads data from other systems through a mapping and external identities (7.1)"
  - id: TMF630@5.0.0/P4/2.2/import-not-for-creating-from-file
    source: TMF630 v5.0.0 P4 §2.2 p.21
    level: recommended
    requirement: An import job should not be used to create new resources from a file.
    status: pending
    note: "gap: STD's import (C7.2) deliberately creates records when neither a mapped source ID nor a match key hits; it is not a TMF ImportJob"
  - id: TMF630@5.0.0/P4/2.2/import-no-generated-identifiers
    source: TMF630 v5.0.0 P4 §2.2 p.21
    level: mandatory
    requirement: An import job must not generate the identification attributes, href or links of the imported resources.
    status: pending
    note: "gap: no TMF ImportJob; STD's import (C7.2) generates record IDs and links source IDs through `core.external_identity` (7.1)"
  - id: TMF630@5.0.0/P4/2.2/import-file-carries-identifiers
    source: TMF630 v5.0.0 P4 §2.2 p.21
    level: mandatory
    requirement: The import file must carry the identification attributes, href and links of every imported resource.
    status: pending
    note: "gap: no TMF ImportJob; C7 import files carry source-system IDs that map to STD record IDs (7.1), not STD ids and hrefs"
  - id: TMF630@5.0.0/P4/3/versioning-pattern-as-specified
    source: TMF630 v5.0.0 P4 §3 p.25
    level: mandatory
    requirement: An implementation that supports entity versioning must implement it exactly as this chapter specifies (support itself is optional unless an API mandates it).
    status: pending
    note: "gap: STD has no entity versioning; its `version` attribute is a per-record revision counter (C10.2, history in C10.4), i.e. TMF's History Pattern, not this pattern"
  - id: TMF630@5.0.0/P4/3.2.3/version-metadata-matches-entity-version
    source: TMF630 v5.0.0 P4 §3.2.3 p.28
    level: recommended
    requirement: The `version` inside a versioned entity's Version sub-entity (`versionMetadata`) should equal the entity's own `version`.
    status: pending
    note: "gap: no entity versioning in STD (no `versionMetadata`)"
  - id: TMF630@5.0.0/P4/3.2.3/exactly-one-current-version
    source: TMF630 v5.0.0 P4 §3.2.3 p.29
    level: mandatory
    requirement: A server implementing versioning must ensure that exactly one version of each entity is current at any time.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.2.3/previous-current-demoted
    source: TMF630 v5.0.0 P4 §3.2.3 p.29
    level: mandatory
    requirement: When another version becomes current, the server must make sure the previously current version stops being current.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.3/version-creation-date-automatic-immutable
    source: TMF630 v5.0.0 P4 §3.3 p.29
    level: mandatory
    requirement: The server must fill the Version sub-entity's `creationDate` automatically when the version is created; it cannot be changed afterwards.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.3/versioned-entity-dates-optional
    source: TMF630 v5.0.0 P4 §3.3 p.29
    level: optional
    requirement: A versioned entity may carry `creationDate` and/or `lastUpdate` properties.
    status: pending
    note: "gap: no entity versioning in STD; records carry `createdAt` and `updatedAt` (C10.2)"
  - id: TMF630@5.0.0/P4/3.3/entity-creation-date-stable-across-versions
    source: TMF630 v5.0.0 P4 §3.3 p.29
    level: mandatory
    requirement: A versioned entity's `creationDate` records when its first version was created and must stay the same on every later version.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.3/last-update-per-version
    source: TMF630 v5.0.0 P4 §3.3 p.30
    level: recommended
    requirement: A versioned entity's `lastUpdate` records when that version was last updated and should be kept separately for each version.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.3/valid-for-optional
    source: TMF630 v5.0.0 P4 §3.3 p.30
    level: optional
    requirement: A versioned entity may have a `validFor` period; how it relates to versions is left to the design.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.4/version-value-populated-on-create
    source: TMF630 v5.0.0 P4 §3.4 p.30
    level: mandatory
    requirement: The `version` designation must be set when a version is created, either from the consumer's input or automatically by the provider; it is optional on input and always present on output.
    status: pending
    note: "gap: no entity versioning in STD; STD's `version` is a server-set revision counter that is always output (C10.2)"
  - id: TMF630@5.0.0/P4/3.4/version-value-unique-per-entity
    source: TMF630 v5.0.0 P4 §3.4 p.30
    level: mandatory
    requirement: Each version's `version` value must be unique among the versions of the same entity (the sentence adds, in lowercase, that it is never changed).
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.4/version-value-semver-string
    source: TMF630 v5.0.0 P4 §3.4 p.30
    level: recommended
    requirement: The `version` value is a JSON string that should follow Semantic Versioning (major.minor.patch, such as "4.2.1").
    status: pending
    note: "C10.2 (spec check F630-25): STD's counter is revision, so version keeps TMF's meaning and is a reserved name."
  - id: TMF630@5.0.0/P4/3.6/implementation-follows-pattern
    source: TMF630 v5.0.0 P4 §3.6 p.32
    level: mandatory
    requirement: An implementation that chooses to version an entity must follow this chapter's pattern; `version` and `versionMetadata` stay optional and the CTK does not enforce them.
    status: pending
    note: "gap: no entity versioning in STD; for TMF Open APIs see tmf-apis (C11)"
  - id: TMF630@5.0.0/P4/3.7.6/create-request-carries-version-metadata
    source: TMF630 v5.0.0 P4 §3.7.6 p.41
    level: recommended
    requirement: When creating the first version of a versioned entity by POST, the client's body should include the Version sub-entity with its POSTable metadata (version string, @type and @versionedEntityType, optionally description and the initiating party).
    status: pending
    note: "client-side: binds creators of versioned entities; STD has no entity versioning"
  - id: TMF630@5.0.0/P4/3.7.6/create-response-full-version-metadata
    source: TMF630 v5.0.0 P4 §3.7.6 p.41
    level: recommended
    requirement: The server's create response should include the fully populated Version sub-entity, with `isCurrent` true for the only version.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.7.7/new-current-version-demotes-old
    source: TMF630 v5.0.0 P4 §3.7.7 p.46
    level: mandatory
    requirement: When a version becomes current (for example by a PATCH after creating a new version), the server must not leave the previously current version current.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.7.9/delete-current-version-409
    source: TMF630 v5.0.0 P4 §3.7.9 p.48
    level: mandatory
    requirement: A DELETE that targets the current version through the version selector must be rejected by the server with 409 Conflict.
    status: pending
    note: "gap: no entity versioning in STD; C10.5 DELETE removes the whole record and defines no version selector"
  - id: TMF630@5.0.0/P4/3.7.9/delete-current-version-message
    source: TMF630 v5.0.0 P4 §3.7.9 p.48
    level: recommended
    requirement: The 409 response to deleting the current version should carry a message saying the current version cannot be deleted.
    status: pending
    note: "gap: no entity versioning in STD"
  - id: TMF630@5.0.0/P4/3.8/events-carry-version
    source: TMF630 v5.0.0 P4 §3.8 p.49
    level: mandatory
    requirement: Standard events raised for a versioned entity must state which version they concern, in particular its `version` property.
    status: pending
    note: hubs (3H, C12); STD has no versioned entities, so no event carries an entity version
  - id: TMF630@5.0.0/P4/3.8/version-create-and-current-events
    source: TMF630 v5.0.0 P4 §3.8 p.50
    level: recommended
    requirement: Besides the standard entity events, a versioned entity should raise events when a version is created ([Entity]VersionCreateEvent) and when a version becomes current ([Entity]VersionCurrentEvent).
    status: pending
    note: hubs (3H, C12); not applicable while STD has no versioned entities
  - id: TMF630@5.0.0/P5/4/patch-query-stop-on-failure
    source: TMF630 v5.0.0 P5 §4 p.9
    level: recommended
    requirement: When a JSON Patch Query document breaks a normative rule, or an operation fails on any of the elements its path selects, the server should stop evaluating the whole document.
    status: excluded
    decision: E15-json-patch-query
    note: "exclusion E15: E15-json-patch-query (STD refuses the media type with 415, C10.5); for plain JSON Patch C10.5 already stops and writes nothing on a failed operation (409 PatchTestFailed)"
  - id: TMF630@5.0.0/P5/4/patch-query-failure-not-successful
    source: TMF630 v5.0.0 P5 §4 p.9
    level: mandatory
    requirement: In that case the server must not treat the patch document as successfully applied (no partial application), following RFC 5789 error handling.
    status: excluded
    decision: E15-json-patch-query
    note: "exclusion E15: E15-json-patch-query; C10.5 applies plain JSON Patch all-or-nothing inside one save"
  - id: TMF630@5.0.0/P5/4/jsonpath-syntax-error-400
    source: TMF630 v5.0.0 P5 §4 p.9
    level: mandatory
    requirement: When a JSON Path expression in a JSON Patch Query path (directly or inside a filter selector) is syntactically invalid, the server must answer 400 Bad Request.
    status: excluded
    decision: E15-json-patch-query
    note: "exclusion E15: E15-json-patch-query (the document is refused with 415 before any path is parsed)"
  - id: TMF630@5.0.0/P5/4/jsonpath-unsupported-501
    source: TMF630 v5.0.0 P5 §4 p.9
    level: mandatory
    requirement: When the client uses JSON Path in a JSON Patch Query document and the server does not support JSON Path, the server must answer 501 Not Implemented.
    status: pending
    note: "exclusion E15: E15-json-patch-query; STD answers 415 for the whole media type instead CONTRADICTION: TMF630 v5.0.0 P5 §4 p.9 says a server that does not support JSON Path must answer a JSON Patch Query that uses it with 501 Not Implemented; Contracts 10.5 and 10.6 say a PATCH with `application/json-patch-query+json` is answered 415 Unsupported Media Type."
  - id: TMF630@5.0.0/P5/6/dot-notation-condition-must-be-true
    source: TMF630 v5.0.0 P5 §6 p.38
    level: mandatory
    requirement: In a JSON Patch Query path of the form <element>?<condition>, written in Part 1's dot notation, an operation applies only to elements for which the condition evaluates to true.
    status: excluded
    decision: E15-json-patch-query
    note: "exclusion E15: E15-json-patch-query"
  - id: TMF630@5.0.0/P6/1/application-json-by-default
    source: TMF630 v5.0.0 P6 §1 p.7
    level: mandatory
    requirement: A server (every REST API) supports the application/json media type by default.
    status: pending
    note: "C10.2: every resource, list and Error is a JSON document served as application/json"
  - id: TMF630@5.0.0/P6/2.3.6/function-extensions-side-effect-free
    source: TMF630 v5.0.0 P6 §2.3.6 p.21
    level: mandatory
    requirement: A JSONPath function extension is defined without side effects, so that any evaluation order or short-circuiting choice gives the same result.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (STD evaluates no JSONPath, so it defines no function extensions)"
  - id: TMF630@5.0.0/P6/2.3.7/standard-function-extensions
    source: TMF630 v5.0.0 P6 §2.3.7 p.21
    level: mandatory
    requirement: An implementation that supports JSONPath supports the standard function extensions length(), count(), match(), search() and value().
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (conditional on JSONPath support, which STD does not offer)"
  - id: TMF630@5.0.0/P6/2.3.7/non-standard-function-extensions
    source: TMF630 v5.0.0 P6 §2.3.7 p.21
    level: optional
    requirement: An implementation that supports JSONPath may add non-standard function extensions.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter"
  - id: TMF630@5.0.0/P6/3/client-percent-encodes-jsonpath
    source: TMF630 v5.0.0 P6 §3 p.37
    level: mandatory
    requirement: A client sending a JSONPath expression in the filter or fields query parameter encodes it correctly; in practice only the square brackets are percent-encoded, while ';' and ',' stay unescaped. (lowercase 'must'; stated as the pattern)
    status: pending
    note: "client-side: binds the client building the URL; STD refuses JSONPath anyway (E14-jsonpath-filter)"
  - id: TMF630@5.0.0/P6/4/filter-parameter-name
    source: TMF630 v5.0.0 P6 §4 p.39
    level: mandatory
    requirement: A JSONPath collection filter is passed in a query parameter named filter, not under any other name.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (C10.3 reserves `filter` for JSONPath and refuses it; STD's own syntax uses `condition`, so the name is not reused)"
  - id: TMF630@5.0.0/P6/4/jsonpath-filter-optional
    source: TMF630 v5.0.0 P6 §4 p.40
    level: optional
    requirement: A server may choose to enable selection of entities by a JSONPath filter expression.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (STD does not enable it in v0.1, C10.3)"
  - id: TMF630@5.0.0/P6/4/filter-unsupported-501
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: A server that does not support the JSONPath filter answers a request using it with 501 Not Implemented.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.3 (spec check F630-26): a JSONPath filter is 501 NotImplemented; exclusion E14 keeps JSONPath out."
  - id: TMF630@5.0.0/P6/4/filter-leading-root-optional
    source: TMF630 v5.0.0 P6 §4 p.40
    level: optional
    requirement: A client may leave out the leading '$.' of the JSONPath expression in filter, and a supporting server accepts that form.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter"
  - id: TMF630@5.0.0/P6/4/filter-returns-full-representation
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: For a JSONPath-filtered list the server returns the complete representation, with all attributes, of every matching entity. (Rule with lowercase 'must')
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (no JSONPath-filtered lists exist; plain lists return full records unless `fields` is given, C10.3)"
  - id: TMF630@5.0.0/P6/4/filter-result-has-id
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: Each entity returned for a filtered query carries an id attribute holding its resource identifier. (Rule with lowercase 'must')
    status: pending
    note: "C10.2: `id` (with `href` and `@type`) is always present on every record, also under `fields` (C10.3)"
  - id: TMF630@5.0.0/P6/4/filter-success-200
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: A successful filtered list request returns 200 OK.
    status: pending
    note: "C10.4: every successful list is 200 with a JSON array (the JSONPath filter itself is refused, E14-jsonpath-filter)"
  - id: TMF630@5.0.0/P6/4/filter-errors-iana-codes
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: Failures of a filtered request use status codes from the IANA HTTP status code registry. (Rule with lowercase 'must')
    status: pending
    note: "C10.6: status codes are those of 3.8, all registered IANA codes"
  - id: TMF630@5.0.0/P6/4/invalid-filter-400
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: A server answers a filter parameter holding an invalid JSONPath expression with 400 Bad Request.
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (C10.3 answers every `filter` value, valid or not, with 400 InvalidFilter, so an invalid one also gets 400)"
  - id: TMF630@5.0.0/P6/4/filter-paginated-as-part1
    source: TMF630 v5.0.0 P6 §4 p.40
    level: mandatory
    requirement: The result of a JSONPath filter is paged by the same rules as Part 1 lists (offset and limit). (Rule; no keyword)
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (every other filter form pages under C10.3/C10.4 offset, limit and cursors)"
  - id: TMF630@5.0.0/P6/4/filter-and-basic-filter-conjunction
    source: TMF630 v5.0.0 P6 §4 p.41
    level: mandatory
    requirement: When attribute (name=value) filters and a JSONPath filter are combined, the server returns only resources that match both. (lowercase 'must')
    status: excluded
    decision: E14-jsonpath-filter
    note: "exclusion E14: E14-jsonpath-filter (C10.3 ANDs every other filter form, including `condition`)"
  - id: TMF630@5.0.0/P6/5/fields-jsonpath
    source: TMF630 v5.0.0 P6 §5 p.46
    level: mandatory
    requirement: A partial representation selected by JSONPath is requested through the fields parameter; a server supporting it evaluates JSONPath paths, predicates and bracket lists there.
    status: pending
    note: "gap: C10.3 `fields` takes attribute names and one-hop dotted paths (which coincide with the JSONPath dot shorthand); bracket, wildcard and predicate forms are refused with 400, and E14 names only `filter`"
  - id: TMF630@5.0.0/P6/8/iana-status-codes
    source: TMF630 v5.0.0 P6 §8 p.53
    level: mandatory
    requirement: REST APIs use the exception and response status codes registered by IANA.
    status: pending
    note: "C10.6: status codes are those of 3.8 (400, 401, 403, 404, 405, 409, 415, 422, 428, 503)"
  - id: TMF630@5.0.0/P6/8/jsonpath-syntax-error-400
    source: TMF630 v5.0.0 P6 §8 p.53
    level: mandatory
    requirement: A server answers a JSONPath expression in filter or fields that fails to parse with 400 Bad Request.
    status: pending
    note: "C10.3: `filter` is always 400 InvalidFilter (E14-jsonpath-filter); a malformed `fields` value is 400 InvalidRequest or UnknownField (3.8)"
  - id: TMF630@5.0.0/P6/8/jsonpath-unsupported-501
    source: TMF630 v5.0.0 P6 §8 p.53
    level: mandatory
    requirement: A server that does not support JSONPath answers a client using JSONPath in filter or fields with 501 Not Implemented.
    status: pending
    note: "C10.3 (spec check F630-26): a JSONPath filter is 501 NotImplemented; JSONPath in fields is an unknown name (400)."
  - id: TMF630@5.0.0/P6/9/test-before-patch
    source: TMF630 v5.0.0 P6 §9 p.54
    level: recommended
    requirement: A client should put a test operation in a JSON Patch document before the operations that change the resource. (lowercase 'recommended')
    status: pending
    note: "client-side: advice to patch authors; C10.5 supports `test` (a failed test is 409 PatchTestFailed)"
  - id: TMF630@5.0.0/P7/binding-nature/binding-for-new-apis
    source: TMF630 v5.0.0 P7 §Binding nature p.6
    level: mandatory
    requirement: The schema prescriptions of Part 7 bind every API designed from now on. (no keyword; stated as the pattern)
    status: pending
    note: "spec-authoring: binds the JSON Schema documents STD serves (per-class `/api/v1/tableMetadata/{table}/schema.json`, C10.1/C10.2) and the per-table OpenAPI documents"
  - id: TMF630@5.0.0/P7/binding-nature/existing-v5-may-deviate
    source: TMF630 v5.0.0 P7 §Binding nature p.6
    level: optional
    requirement: Already published V5 TMF Open APIs may break the Part 7 prescriptions for the time being.
    status: pending
    note: "tmf-apis (C11): concerns TM Forum's published V5 schemas, which STD's TMF adapters pin as they are"
  - id: TMF630@5.0.0/P7/binding-nature/adhere-on-further-development
    source: TMF630 v5.0.0 P7 §Binding nature p.6
    level: recommended
    requirement: When an existing V5 API is developed further, its authors should bring it fully in line with Part 7.
    status: pending
    note: "tmf-apis (C11): binds TM Forum's API authors"
  - id: TMF630@5.0.0/P7/notation-convention/subclass-member-compatible
    source: TMF630 v5.0.0 P7 §Notation convention p.8
    level: mandatory
    requirement: A subclass schema that repeats a member of its superclass gives it a compatible type and keeps the superclass restrictions, though it may restrict it further (e.g. make it required). (lowercase 'must')
    status: pending
    note: "C10.2: a child class cannot redefine a parent attribute (the schema engine refuses a clashing API name with `apiNameClash`), so the per-class schema.json never widens an inherited member"
  - id: TMF630@5.0.0/P7/1.1.3/addressable-unchanged
    source: TMF630 v5.0.0 P7 §1.1.3 p.11
    level: mandatory
    requirement: No API modifies the common Addressable schema (string id and href).
    status: pending
    note: "spec-authoring: STD's schema.json and OpenAPI documents describe `id` and `href` as plain strings, as Addressable does (C10.2)"
  - id: TMF630@5.0.0/P7/1.2.3/extensible-unchanged
    source: TMF630 v5.0.0 P7 §1.2.3 p.12
    level: mandatory
    requirement: No API modifies the common Extensible schema (@type, @baseType, @schemaLocation).
    status: pending
    note: "spec-authoring: STD's documents describe `@type`, `@baseType` and `@schemaLocation` as Extensible does (C10.2)"
  - id: TMF630@5.0.0/P7/1.2.3/type-required-discriminator
