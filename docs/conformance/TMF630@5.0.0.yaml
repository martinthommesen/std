    status: pending
    note: "gap: STD never sends 206 (C10.4); note TMF630's own §4.3.1 p.52 requires 200 for a partial representation chosen with `fields`, so the rule is internally inconsistent CONTRADICTION: TMF630 v5.0.0 P1 §3.3.1 p.30 says 206 is used for a partial resource or range-based offset pagination; Contracts 10.4 says list responses are `200` (no `206` is defined) and 10.3 returns `fields` selections with the normal success code."
  - id: TMF630@5.0.0/P1/3.3.2/redirection-codes
    source: TMF630 v5.0.0 P1 §3.3.2 p.30
    level: mandatory
    requirement: When the client must take further action to complete a request, the server uses the 3xx codes listed in 3.3.2.
