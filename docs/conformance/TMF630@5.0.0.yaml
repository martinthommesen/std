  - id: TMF630@5.0.0/P1/4.3.3/same-attribute-both-markers-409
    source: TMF630 v5.0.0 P1 §4.3.3 p.56
    level: mandatory
    requirement: If fields both includes and excludes (!) the same attribute, the server answers 409 Conflict.
    status: tested
    tests:
      - "packages/server/test/tmf630-conformance.test.ts#same-attribute fields conflicts reject both marker orders on generic lists and reads"
      - "packages/server/test/dead-letter-api.test.ts#same-attribute fields conflicts reject both marker orders on dead-delivery lists and reads"
      - "packages/server/test/tmf-framework.test.ts#same-attribute fields conflicts use declared 400 in both marker orders on mapped lists and reads"
      - "packages/server/test/tmf621.test.ts#same-attribute fields conflicts use declared 400 in both marker orders on shipped TMF621 lists and reads"
      - "packages/server/test/tmf688.test.ts#TMF688 fields conflicts use exact errors and each operation's declared status"
      - "packages/server/test/api-history.test.ts#same-attribute fields conflicts reject both marker orders on history lists and reads"
      - "packages/server/test/selector-writes.test.ts#generic record and definition writes reject both fields marker orders with exact 409"
      - "packages/server/test/selector-writes.test.ts#mapped create and patch responses reject both fields marker orders with exact declared 409"
      - "packages/server/test/selector-writes.test.ts#shipped TMF621 create and patch responses reject both fields marker orders with exact declared 409"
    note: "Exact maintained HTTP status and complete error-body assertions cover both marker orders on generic base/concrete list and single reads, dead deliveries, history (including empty filtered and past-end pages), the mapped framework, both shipped TMF621 resources, and all seven TMF688 selector GET forms. Enabled generic record/definition and mapped/TMF621 create and patch response selectors are also covered. Generic/history/dead-delivery and enabled writes use 409; mapped/TMF621 GETs and the TMF688 top-level hub extension use their declared 400 under Contracts 11.1 and decision 0033. Identity attributes remain mandatory and are not conflicting optional attributes. History keeps its whole authorized embedded changes/fields selection. Fixed session, metadata, schema/OpenAPI, task/journal and shared generic/TMF621 hub retrieval modules declare no fields selector; TMF688 writes do not project by fields. No new exclusion or other row is claimed. Generic definition POST and merge PATCH validate request-only response-selector refusals before applying the change set (packages/server/test/api-definitions.test.ts atomicity tests). These status proofs do not certify general rollback: rights/schema changes and infrastructure failures after commit can still prevent the response read."
