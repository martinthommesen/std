    note: "C10.5: `POST /api/v1/{table}` is `201`; gap: the status of `POST /api/v1/changeSet` (a persisted task) and `session` is not stated"
  - id: TMF630@5.0.0/P1/3.3.1/status-201-body-and-location
    source: TMF630 v5.0.0 P1 §3.3.1 p.29
