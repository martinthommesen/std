    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: `201` with the resource and `Location`"
  - id: TMF630@5.0.0/P1/3.3.1/status-202-accepted
    source: TMF630 v5.0.0 P1 §3.3.1 p.30
    level: mandatory
