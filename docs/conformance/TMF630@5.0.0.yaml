    source: TMF630 v4.0.0 P2 §1 p.3
    level: recommended
    requirement: "A collection implicitly scopes the @type of the resources it holds: a subtype's collection holds only that subtype. (no keyword; stated as the pattern)"
    status: pending
    note: "C10.1: each class is its own collection /api/v1/{table}; C2.3 endpoint E lists subtree(E), so a subtype collection also holds its own descendants"
  - id: TMF630@5.0.0/v4.0.0-P2/1/basetype-names-base-collection
    source: TMF630 v4.0.0 P2 §1 p.3
    level: optional
    requirement: An entity's @baseType may be used to denote the collection of all entities sharing that base type (e.g. a logicalResource collection holding both Tpe and Link).
    status: pending
    note: "C10.2: @baseType is the direct parent's type name (TMF630 v5.0.0 P8 rules 3, 6-9); for a two-level hierarchy it names the base collection."
  - id: TMF630@5.0.0/v4.0.0-P2/1/base-query-returns-all-concrete-subtypes
    source: TMF630 v4.0.0 P2 §1 p.4
    level: recommended
    requirement: A query on a base collection returns the concrete representations of every resource compatible with the base type. (no keyword; stated as the pattern)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
      - packages/server/test/api-review.test.ts#api-review
    note: "C10.2 (Martin 2026-10-22, D1): reads and lists through a parent collection return each record's concrete representation under its access rules."
  - id: TMF630@5.0.0/v4.0.0-P2/1/abstract-types-never-returned
    source: TMF630 v4.0.0 P2 §1 p.4
    level: recommended
    requirement: The server never returns objects of an abstract type; a base collection over an abstract type returns only its concrete subtypes. (no keyword; stated as the pattern)
    status: pending
    note: "gap: STD has no abstract classes; every class can hold its own records and a parent's own records are listed through it (C2.3); metadata only says whether a table is creatable (C6.3)"
  - id: TMF630@5.0.0/v4.0.0-P2/1/operations-relative-to-base-type
    source: TMF630 v4.0.0 P2 §1 p.5
    level: recommended
    requirement: All operations should be addressed relative to the base type's collection.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: operations work through the base collection (reads, polymorphic creates, updates, deletes); href stays the canonical concrete URI and Content-Location plus Link self/canonical declare both (reviewer, decision 0025)."
  - id: TMF630@5.0.0/v4.0.0-P2/1/derived-collections-optional
    source: TMF630 v4.0.0 P2 §1 p.5
    level: optional
    requirement: The API designer may expose additional (subtype) collections; these need not offer every operation of the base collection.
    status: pending
    note: "C10.1: every class, parent or child, is its own collection with the full set of operations"
  - id: TMF630@5.0.0/v4.0.0-P2/1/alternative-uri-in-header
    source: TMF630 v4.0.0 P2 §1 p.5
    level: mandatory
    requirement: The server must declare in a response header the alternative URI that also identifies the entity (e.g. /link/42 for a logical resource of type Link).
    status: pending
    note: "gap: no header names another collection's URI for the record; href in the body is the concrete-class URL (C10.2)"
  - id: TMF630@5.0.0/v4.0.0-P2/1/id-relative-to-base-collection
    source: TMF630 v4.0.0 P2 §1 p.5
    level: mandatory
    requirement: A resource's id must always be relative to (unique within) the base collection.
    status: pending
    note: "C2.1/C2.3: one id across every level of a hierarchy; GET /{ancestor}/{id} finds any record of subtree(ancestor)"
  - id: TMF630@5.0.0/v4.0.0-P2/1.1/base-query-by-type-and-id
    source: TMF630 v4.0.0 P2 §1.1 p.6
    level: optional
    requirement: A client may narrow a base-collection query to several concrete types by repeating @type, or to specific resources by repeating id.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.3: @type=<class> and repeated parameters are in (OR); id filters by the same repeated-parameter rule"
  - id: TMF630@5.0.0/v4.0.0-P2/1.2/create-through-base-collection
    source: TMF630 v4.0.0 P2 §1.2 p.9
    level: recommended
    requirement: The server lets a client create a concrete subtype by POSTing to the base collection with @type naming the subtype, answering 201 with the full representation (provided and default attributes). (no keyword; stated as the pattern)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5: @type optional, must name a class of subtree(table) the caller knows; 201 with resource and Location. gap: Contracts does not say whether the 201 body through a parent includes child-only attributes, and under C2.3 it would not"
  - id: TMF630@5.0.0/v4.0.0-P2/1.2/update-delete-through-base-collection
    source: TMF630 v4.0.0 P2 §1.2 p.9
    level: recommended
    requirement: The server lets a client PATCH (200 with the updated resource) and DELETE (204) a concrete resource through its base collection. (no keyword; stated as the pattern)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.5/C2.2 item 5: PATCH and DELETE work through any ancestor endpoint, 200 and 204"
  - id: TMF630@5.0.0/v4.0.0-P2/2/extension-conformance
    source: TMF630 v4.0.0 P2 §2 p.11
    level: mandatory
    requirement: An implementation's extension is conformant only if it keeps the API's core characteristics intact and does not contradict the design guidelines. (no keyword; stated as the pattern)
    status: excluded
    decision: E19-generic-api-extensions
    note: "exclusion E19: E19-generic-api-extensions (withheld, condition, count=false, refusing unknown parameters)"
  - id: TMF630@5.0.0/v4.0.0-P2/2/subclass-keeps-base-mandatory
    source: TMF630 v4.0.0 P2 §2 p.11
    level: recommended
    requirement: When a schema is extended by subclassing, the subclass should carry every mandatory attribute and relationship of the base schema.
    status: pending
    note: "C2.1/C2.5: a child class inherits every parent field; overrides may tighten but never drop a required field"
  - id: TMF630@5.0.0/v4.0.0-P2/2/extension-by-characteristics-or-relationships
    source: TMF630 v4.0.0 P2 §2 p.11
    level: optional
    requirement: An API may also be extended at run time by adding characteristics or by adding relationships.
    status: pending
    note: "tmf-apis (C11): characteristics belong to TMF schemas; in the generic API extensions are new fields, including reference fields rendered as EntityRefs (C10.2)"
  - id: TMF630@5.0.0/v4.0.0-P2/2/no-opaque-name-value-pairs
    source: TMF630 v4.0.0 P2 §2 p.11
    level: recommended
    requirement: Implementations should not extend an API with opaque name/value pairs.
    status: pending
    note: "C10.2/C6.5: every attribute is a typed, schema-defined field; a json field holds a value of one declared attribute, not free extension pairs"
  - id: TMF630@5.0.0/v4.0.0-P2/2/schema-defined-characteristics
    source: TMF630 v4.0.0 P2 §2 p.11
    level: mandatory
    requirement: Where characteristics extend an API, they must be schema-defined characteristics.
    status: pending
    note: "tmf-apis (C11): applies to TMF characteristic arrays; the generic API has no characteristics"
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/schemalocation-reserved-link
    source: TMF630 v4.0.0 P2 §2.1 p.11
    level: recommended
    requirement: The server treats @schemaLocation as a reserved attribute holding a link to the schema that describes the resource. (no keyword; stated as the pattern)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
      - packages/server/test/api-review-2.test.ts#api-review-2
    note: "C10.2: @schemaLocation is /api/v1/tableMetadata/{class}/schema.json, the caller's JSON Schema of the concrete class; every resource validates against it, typed references included."
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/extension-schema-includes-base
    source: TMF630 v4.0.0 P2 §2.1 p.11
    level: mandatory
    requirement: An extension (subtype) schema must include every attribute of its base schema.
    status: excluded
    decision: X630-hidden-base-fields
    note: "exclusion X630-hidden-base-fields (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/polymorphic-attributes-optional-in-all-schemas
    source: TMF630 v4.0.0 P2 §2.1 p.12
    level: mandatory
    requirement: Because any resource may be extended, every resource's structure definition must support @type, @baseType and @schemaLocation as optional attributes.
    status: pending
    note: "spec-authoring: constrains STD's per-table openapi.json and schema.json (C6.3, C10.2), which must declare the three attributes; Contracts does not say so explicitly"
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/non-extensible-may-omit-polymorphic-attributes
    source: TMF630 v4.0.0 P2 §2.1 p.12
    level: optional
    requirement: An API specification need not list @type, @baseType and @schemaLocation explicitly for resources not expected to be extended.
    status: pending
    note: "spec-authoring: every STD table can gain a child class (C2.1), so no generic table qualifies"
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/extensible-resources-declare-polymorphic-attributes
    source: TMF630 v4.0.0 P2 §2.1 p.13
    level: mandatory
    requirement: In the API data model, resources identified as expected to be extended (e.g. Party, PartyRole, GeographicAddress, Characteristic) must explicitly include @type, @baseType and @schemaLocation.
    status: pending
    note: "spec-authoring: constrains per-table openapi.json and schema.json (every table is extensible, C2.1); for TMF resources tmf-apis (C11)"
  - id: TMF630@5.0.0/v4.0.0-P2/2.1/allof-for-extension
    source: TMF630 v4.0.0 P2 §2.1 p.13
    level: recommended
    requirement: API specification authors should extend an object with allOf in Swagger 2.0 and OpenAPI 3.0 schemas.
    status: pending
    note: "spec-authoring: constrains the child-class schema.json and openapi.json STD serves; gap: Contracts 6.3 and 10.2 do not say child schemas compose the parent's with allOf"
  - id: TMF630@5.0.0/v4.0.0-P2/2.2/runtime-extension-by-characteristics
    source: TMF630 v4.0.0 P2 §2.2 p.13
    level: optional
    requirement: Where the Characteristic/CharacteristicSpec pattern is used, an API may be extended at run time with simple or complex characteristics.
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.2/characteristic-attributes
    source: TMF630 v4.0.0 P2 §2.2 p.15
    level: recommended
    requirement: A characteristic carries name, value (string or object), valueType, @type and @schemaLocation. (no keyword; stated as the pattern)
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.2/complex-characteristic-shape
    source: TMF630 v4.0.0 P2 §2.2 p.15
    level: recommended
    requirement: For a complex characteristic, name is the object's name, value is the object, and @schemaLocation links to the schema describing it. (no keyword; stated as the pattern)
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/state-enum-not-removed-or-redefined
    source: TMF630 v4.0.0 P2 §2.3 p.19
    level: mandatory
    requirement: An implementation must not remove the specification's lifecycle states or redefine their meaning.
    status: pending
    note: "tmf-apis (C11): applies to TMF state enumerations; STD-defined choices are local definitions"
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/state-enum-may-be-extended
    source: TMF630 v4.0.0 P2 §2.3 p.19
    level: optional
    requirement: An implementation may add states (breadth) and sub-states (depth) to a lifecycle enumeration.
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/state-transitions-illustrative
    source: TMF630 v4.0.0 P2 §2.3 p.19
    level: optional
    requirement: A compliant implementation may transition between states as it chooses; the specification's state diagram is illustrative.
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/document-transition-variations
    source: TMF630 v4.0.0 P2 §2.3 p.19
    level: recommended
    requirement: An implementation should document where its state transitions differ from the specification's diagram. (no keyword; stated as the pattern)
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/operational-administrative-state-separate
    source: TMF630 v4.0.0 P2 §2.3 p.19
    level: recommended
    requirement: Specification authors and implementations should keep a resource's operational state and administrative state separate rather than merging them.
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/sub-state-dotted-notation
    source: TMF630 v4.0.0 P2 §2.3 p.20
    level: optional
    requirement: Sub-states may be expressed with a dotted notation under a macro state (e.g. inProgress.held).
    status: pending
    note: tmf-apis (C11)
  - id: TMF630@5.0.0/v4.0.0-P2/2.3/consumers-expect-sub-states
    source: TMF630 v4.0.0 P2 §2.3 p.20
    level: recommended
    requirement: Clients should allow for sub-states and match a state together with its dotted sub-states rather than by exact value.
    status: pending
    note: "client-side: binds consumers of state attributes"
  - id: TMF630@5.0.0/v4.0.0-P2/3/depth-expands-references
    source: TMF630 v4.0.0 P2 §3 p.21
    level: recommended
    requirement: The server supports a depth directive on GET that expands referenced resources inline up to the given level. (no keyword; stated as the pattern)
    status: pending
    note: "gap: the API has no depth parameter; fields allows one-hop reference paths (assignedTo.name) and an unknown parameter is InvalidRequest (C10.3)"
  - id: TMF630@5.0.0/v4.0.0-P2/3/depth-level-semantics
    source: TMF630 v4.0.0 P2 §3 p.21
    level: recommended
    requirement: At depth 0 references carry only id and @type (optionally name and href); depth 1 replaces first-level references with the loaded entities; depth N expands recursively and the last level stays references. (no keyword; stated as the pattern)
    status: pending
    note: "gap: no depth; references are always EntityRefs with @type, id, href, @referredType, name (C10.2), matching depth 0"
  - id: TMF630@5.0.0/v4.0.0-P2/3/depth-no-infinite-recursion
    source: TMF630 v4.0.0 P2 §3 p.21
    level: recommended
    requirement: "Expansion should not recurse infinitely on circular references: an object is expanded where first met and stays a reference elsewhere."
    status: pending
    note: "gap: no depth expansion"
  - id: TMF630@5.0.0/v4.0.0-P2/3/expand-narrows-paths
    source: TMF630 v4.0.0 P2 §3 p.21
    level: recommended
    requirement: The server supports an expand parameter that restricts which reference paths are expanded; without it all paths should be expanded, with it only the named paths. (no keyword; stated as the pattern)
    status: pending
    note: "gap: the API has no expand parameter (InvalidRequest as unknown, C10.3)"
  - id: TMF630@5.0.0/v4.0.0-P2/3/depth-default-from-expand
    source: TMF630 v4.0.0 P2 §3 p.21
    level: recommended
    requirement: When depth is absent the server uses depth 1 if expand is given and depth 0 otherwise. (no keyword; stated as the pattern)
    status: pending
    note: "gap: no depth or expand"
  - id: TMF630@5.0.0/v4.0.0-P2/4/ref-or-value-pattern
    source: TMF630 v4.0.0 P2 §4 p.25
    level: optional
    requirement: "Where a client must pass objects that may or may not already exist on the server, the API may use the EntityRefOrValue pattern: a reference for existing objects, a value otherwise."
    status: pending
    note: "gap: generic reference fields accept only an existing record's id (C10.2, C6.5); nothing is created by value. tmf-apis (C11) where TMF schemas use RefOrValue"
  - id: TMF630@5.0.0/v4.0.0-P2/4/ref-or-value-attributes-optional
    source: TMF630 v4.0.0 P2 §4 p.25
    level: recommended
    requirement: In an EntityRefOrValue schema all attributes are optional. (no keyword; stated as the pattern)
    status: pending
    note: "spec-authoring: only where a schema uses RefOrValue; STD's per-table documents use EntityRef only; tmf-apis (C11)"
  - id: TMF630@5.0.0/v4.0.0-P2/4/ref-requires-id-and-href
    source: TMF630 v4.0.0 P2 §4 p.25
    level: mandatory
    requirement: An EntityRef (including the ref form of RefOrValue) must contain id and href; other attributes of the plain entity may be added.
    status: excluded
    decision: X630-referred-type-hidden
    note: "exclusion X630-referred-type-hidden (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/v4.0.0-P2/4/value-requires-entity-mandatory-attributes
    source: TMF630 v4.0.0 P2 §4 p.25
    level: mandatory
    requirement: When RefOrValue is passed as a value, only the referenced entity's mandatory attributes are required; id and href may be added when the value modifies an existing entity.
    status: pending
    note: "gap: no by-value references in the generic API; tmf-apis (C11)"
  - id: TMF630@5.0.0/v4.0.0-P2/4/ref-entity-defined-in-model
    source: TMF630 v4.0.0 P2 §4 p.25
    level: mandatory
    requirement: To apply the pattern to an entity, the API data model must define the matching ref entity (e.g. ProductRef). (no keyword; stated as the pattern)
    status: pending
    note: "spec-authoring: STD's documents use one generic EntityRef schema for every reference (C10.2); TMF documents are pinned (C11)"
  - id: TMF630@5.0.0/v4.0.0-P2/4/data-model-links-plain-class
    source: TMF630 v4.0.0 P2 §4 p.25
    level: recommended
    requirement: Since any class may be used as RefOrValue, the API data model should link to the plain class and mark on the relationship whether the RefOrValue pattern applies.
    status: pending
    note: "spec-authoring: data-model authoring for TMF APIs; tmf-apis (C11)"
  - id: TMF630@5.0.0/v4.0.0-P2/4.1/swagger2-ref-or-value-as-value
    source: TMF630 v4.0.0 P2 §4.1 p.26
    level: recommended
    requirement: In Swagger 2.0 specifications authors should define a RefOrValue schema as the value class with all properties optional, leaving ref-or-value handling to the implementation.
    status: pending
    note: "spec-authoring: STD publishes OpenAPI 3.1, not Swagger 2.0 (C6.3, C10.1)"
  - id: TMF630@5.0.0/v4.0.0-P2/4.1/oas3-ref-or-value-oneof
    source: TMF630 v4.0.0 P2 §4.1 p.28
    level: recommended
    requirement: In OpenAPI 3.0 specifications authors should express RefOrValue as a oneOf between the value class and the ref class.
    status: pending
    note: "spec-authoring: applies only where a schema served by STD uses RefOrValue (TMF documents, C11); the per-table openapi.json has only EntityRefs"
  - id: TMF630@5.0.0/v4.0.0-P2/5/entity-ref-for-existing-objects
    source: TMF630 v4.0.0 P2 §5 p.32
    level: recommended
    requirement: Objects that already exist on the server are passed by reference with the EntityRef pattern. (no keyword; stated as the pattern)
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: every reference field is an EntityRef in reads and writes"
  - id: TMF630@5.0.0/v4.0.0-P2/5/entity-ref-id-and-href
    source: TMF630 v4.0.0 P2 §5 p.32
    level: mandatory
    requirement: An EntityRef must contain id and href.
    status: excluded
    decision: X630-referred-type-hidden
    note: "exclusion X630-referred-type-hidden (Martin 2026-10-22, D2): information hiding wins (Contracts 3.4)."
  - id: TMF630@5.0.0/v4.0.0-P2/5/entity-ref-optional-attributes
    source: TMF630 v4.0.0 P2 §5 p.32
    level: optional
    requirement: An EntityRef may also carry attributes of the plain entity such as name, @type, @schemaLocation, validFor or role.
    status: tested
    tests:
      - packages/server/test/tmf630-conformance.test.ts#tmf630-conformance
    note: "C10.2: name (3.6 label rule), @referredType and @type are carried"
  - id: TMF630@5.0.0/v4.0.0-P2/5/entity-ref-type-only-when-subclassed
    source: TMF630 v4.0.0 P2 §5 p.32
    level: optional
    requirement: "@type on an EntityRef is generally unnecessary; when present it signals that the reference object is a subclass per the extension patterns."
    status: pending
    note: 'C10.2: every reference carries @type "EntityRef" (the ref''s own class, v5 style) and names the target class in @referredType; allowed, since @type is optional here'
  - id: TMF630@5.0.0/v4.0.0-P3/exec-summary/hypermedia-extension-optional
    source: TMF630 v4.0.0 P3 §Executive Summary p.1
    level: optional
    requirement: An API may support the hypermedia extension, added without changing the existing payload.
    status: pending
    note: "gap: STD's generic API has no hypermedia extension (no _links, no home document); records are flat objects with href (C10.2)"
  - id: TMF630@5.0.0/v4.0.0-P3/exec-summary/json-ld-optional
    source: TMF630 v4.0.0 P3 §Executive Summary p.1
    level: optional
    requirement: An API may support JSON-LD, added without changing the existing payload.
    status: pending
    note: "gap: no JSON-LD support in the generic API (C10)"
  - id: TMF630@5.0.0/v4.0.0-P3/1/hypermedia-api-follows-rest
    source: TMF630 v4.0.0 P3 §1 p.3
    level: mandatory
    requirement: A hypermedia API shall follow the REST architectural style, with hypermedia driving application state (HATEOAS).
    status: pending
    note: 'gap: only href, Location and Link rel="next" act as hypermedia controls (C10.2, C10.4, C10.5); no state-transition links'
  - id: TMF630@5.0.0/v4.0.0-P3/2/consistent-link-discovery
    source: TMF630 v4.0.0 P3 §2 p.4
    level: mandatory
    requirement: A hypermedia API must give clients one consistent way to discover the links available in a representation.
    status: pending
    note: "gap: no _links; links are only href attributes and Link headers (C10.2, C10.4)"
  - id: TMF630@5.0.0/v4.0.0-P3/2.1/json-media-type
    source: TMF630 v4.0.0 P3 §2.1 p.4
    level: recommended
    requirement: The server uses JSON representations with the plain application/json media type. (no keyword; stated as the pattern)
    status: pending
    note: "C10.2/C10.4: records and lists are JSON (application/json); PATCH also accepts merge-patch and JSON Patch (C10.5)"
  - id: TMF630@5.0.0/v4.0.0-P3/2.1/hypermedia-no-special-media-type
    source: TMF630 v4.0.0 P3 §2.1 p.4
    level: recommended
    requirement: A server supporting hypermedia adds links to the application/json representation without a dedicated media type or media-type negotiation, so existing JSON clients keep working. (no keyword; stated as the pattern)
    status: pending
    note: "gap: no hypermedia extension; nothing is negotiated by media type (C10)"
  - id: TMF630@5.0.0/v4.0.0-P3/2.2/home-new-link-relations
    source: TMF630 v4.0.0 P3 §2.2 p.4
    level: optional
    requirement: An API provider may add new link relation types to the home document at any time.
    status: pending
    note: "gap: no home document"
  - id: TMF630@5.0.0/v4.0.0-P3/2.2/clients-tolerate-new-relations
    source: TMF630 v4.0.0 P3 §2.2 p.4
    level: mandatory
    requirement: Clients must not fail when a home document contains link relation types they do not know.
