  - id: E26-tmf621-read-only-attributes
    rows: []
    requirement: "TMF621 attributes the user guide lists as patchable that STD would keep read-only: priority, statusChangeHistory, resolutionDate, and ticketType after create"
    reason: "Proposed by the spec check (decision 0026, F621-05, F621-06). Martin rejected it: the four are writable through TMF621 PATCH (ticketType within its class), the ITIL behaviors behind them are defaults and form rules (decision 0021, decisions 34, 40 and 53); the rows it covered are pending again."
    recommendation: accept
    state: decided
    outcome: rejected
    decidedBy: Martin
    words: "tmforum always takes priority over ITIL. We can always lock down fields that tmforum wants writeable in the ui."
    date: 2026-10-22
  - id: E27-tmf-if-match-optional
    rows: []
    requirement: "`If-Match` optional on TMF API writes, although TMF630 v5.0.0 Part 1 §1.5.3 p.14 recommends ETag preconditions"
    reason: "The CTKs and TMF clients send no precondition; a stale `If-Match`, when sent, answers the version-conflict status the pinned document declares (`409` for TMF621), with the current ETag (Contracts 11.1; decision 0026, M2; amended by decision 0021, decision 55)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M2: 412 with the current ETag for a stale If-Match and 428 for a missing required one on /api/v2 and the TMF APIs; If-Match stays optional on the TMF APIs as an accepted exclusion (relayed by the coordinator)."
    date: 2026-10-22
  - id: E28-oda-component-identity
    rows: []
    requirement: "`componentMetadata.id` and `name` of the ODA Component name a published TM Forum component specification (the v1 Component CRD's field descriptions)"
    reason: "STD is a custom component; no golden specification exposes TMF621 (Contracts 13.1; decision 0026, M13, FODA-01)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M13: new exclusion, decided accepted (relayed by the coordinator)."
    date: 2026-10-22
  - id: E29-hub-registration-429
    rows: []
    requirement: "`429` on TMF hub registration, a status the pinned OpenAPI documents do not declare"
    reason: "Hub registrations are config commits and are rate-limited per user (Contracts 12.2); TMF routes otherwise answer only declared statuses (Contracts 11.1; decision 0026, M18)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M18: TMF routes answer only statuses the pinned document declares; 429 on hub registration is a recorded deviation (relayed by the coordinator)."
    date: 2026-10-22
  - id: X630-hidden-base-fields
    rows:
      - TMF630@5.0.0/v4.0.0-P2/2.1/extension-schema-includes-base
    requirement: "TMF630 v4.0.0 Part 2 §2.1 p.11: an extension schema includes every attribute of its base schema"
    reason: "A table's schema.json is the caller's: it names no field the caller cannot read, so a child class's schema can leave out an inherited field the caller may not read there (Contracts 3.4, 10.2)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "Where TMF630 would reveal what a caller may not see, information hiding wins, each with a narrow recorded exclusion."
    date: 2026-10-22
  - id: X630-referred-type-hidden
    rows:
      - TMF630@5.0.0/P7/1.4.2/entityref-id-referredtype-required
      - TMF630@5.0.0/v4.0.0-P2/4/ref-requires-id-and-href
      - TMF630@5.0.0/v4.0.0-P2/5/entity-ref-id-and-href
    requirement: "TMF630 v5.0.0 Part 7 §1.4.2 p.14 (@referredType required) and v4.0.0 Part 2 §4 p.25, §5 p.32 (href required) on EntityRefs"
    reason: "A reference to a target the caller cannot see, whose declared class the caller does not know, carries only id: @referredType and href would name a class the caller cannot know (Contracts 3.4, 10.2)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "Where TMF630 would reveal what a caller may not see, information hiding wins, each with a narrow recorded exclusion."
    date: 2026-10-22
  - id: X630-identical-404
    rows:
      - TMF630@5.0.0/P1/3.3.3/status-403-outside-scope
      - TMF630@5.0.0/P1/3.3.3/status-410-gone
    requirement: "TMF630 v5.0.0 Part 1 §3.3.3 pp.31-32: 403 outside the permitted scope and 410 for a resource no longer available (SHOULD)"
    reason: "A table or record the caller cannot see, one that never existed and a deleted one answer the same 404, so the answer reveals nothing (Contracts 3.4, 3.8)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "Where TMF630 would reveal what a caller may not see, information hiding wins, each with a narrow recorded exclusion."
    date: 2026-10-22
  - id: X630-no-store
    rows:
      - TMF630@5.0.0/P1/1.5.1/caching-encouraged
      - TMF630@5.0.0/P1/1.5.1/expiration-headers-on-get-200
      - TMF630@5.0.0/P1/1.5.1/no-cache-only-when-necessary
    requirement: "TMF630 v5.0.0 Part 1 §1.5.1 p.11: caching should be encouraged and GET 200 responses carry expiration headers (SHOULD)"
    reason: "Every API response carries Cache-Control: no-store (decision 0018): a cookie-authenticated response must never be stored by a shared cache; Part 1 §1.5.1 permits discouraging caching."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "Where TMF630 would reveal what a caller may not see, information hiding wins, each with a narrow recorded exclusion."
    date: 2026-10-22
