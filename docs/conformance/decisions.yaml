# Conformance decision log (Contracts 15.1). Each entry is an exclusion of
# requirement rows; `rows` lists the row IDs it covers and is filled in as the
# matrix files are written (workstreams 3G and 3T).
entries:
  - id: E14-jsonpath-filter
    decision0021: 14
    rows:
      - TMF621@5.0.1/OAS/query/filter-jsonpath
    requirement: "TMF630 part 6: JSONPath `filter` query parameter"
    reason: "The condition AST has no array semantics; refused with `InvalidFilter` `jsonPathNotSupported` (Contracts 10.3)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E15-json-patch-query
    decision0021: 15
    rows:
      - TMF621@5.0.1/OAS/media/patch-json-patch-query
    requirement: "TMF630 part 5: `application/json-patch-query+json`"
    reason: "Refused with 415 (Contracts 10.5)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E16-array-json-filters
    decision0021: 16
    rows:
      - TMF621@5.0.1/CP/get/filter-sub-resources
      - TMF688@4.0.0/CP/get/filter-sub-resources
    requirement: "Filters on array and json attributes of TMF resources"
    reason: "The condition AST has no any-element operator; refused with `attributeNotFilterable` (Contracts 11.1). TMF630 v5.0.0 Part 1 §4.4.1 p.68 defines dotted filters on arrays as testing every element; filtering on sub-resources is optional in the TMF621, TMF688, TMF632, TMF669 and TMF672 conformance profiles (decision 0026)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E17-regex-exact-operators
    decision0021: 17
    rows: []
    requirement: "The `.regex` and `.exact` filter operators"
    reason: "The condition AST has no regular expressions (Contracts 10.3)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E18-if-match-required
    decision0021: 18
    rows: []
    requirement: "`If-Match` required on the generic API's PATCH and DELETE"
    reason: "STD's generic API never writes last-wins; TMF APIs keep it optional (Contracts 10.5, 11.1)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E19-generic-api-extensions
    decision0021: 19
    rows: []
    requirement: "STD's extensions to the generic API: `withheld`, `condition`, `count=false`, refusal of unknown query parameters"
    reason: "They keep restricted fields visible as restricted and never widen a result silently (Contracts 10.2, 10.3)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E20-resources-not-served
    decision0021: 20
    rows: []
    requirement: "`serviceOrderSpecification` (TMF641); TMF621 `troubleTicketSpecification` was withdrawn from this exclusion on 2026-10-22 and is served (decision 0021, decision 38)"
    reason: "Not served in v0.1 (Contracts 11.1). Both are optional: TMF621 CP v5.0.0 p.2 and TMF641 CP v4.2.0 §2.1 p.6 make TroubleTicket and ServiceOrder the only mandatory resources. Decision 0026 M4 asks whether the TMF621 kit tests troubleTicketSpecification anyway."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E21-order-events-and-cancellation-states
    decision0021: 21
    rows: []
    requirement: "TMF641 and TMF622 Milestone, Jeopardy and ErrorMessage events; `assessingCancellation` and `pendingCancellation` never shown"
    reason: "Cancellations are decided synchronously (Contracts 11.5, 14.4)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E22-tmf621-notes-attachments
    decision0021: 22
    rows:
      - TMF621@5.0.1/OAS/attachment/content
    requirement: "TMF621 attachments as references only (notes are no longer append-only: a merge-patch replaces the note array, decision 0021, decision 41)"
    reason: "Attachments are a later field type (Contracts 11.2)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E23-tmf672-not-representable
    decision0021: 23
    rows:
      - TMF672@5.1.0/CP/post/permissionSet-not-one-role
      - TMF672@5.1.0/CP/post/permissionSpecificationSet-read-only-rule
      - TMF672@5.1.0/OAS/operations/patchPermissionSpecification-read-only-rule
      - TMF672@5.1.0/OAS/operations/deletePermissionSpecification-read-only-rule
    requirement: "TMF672 writes the projection cannot represent: changing or deleting a deny, field, conditional or multi-action rule; a set POST naming such a rule; a permissionSet POST whose permission[] is not one role's projected specifications or a subset"
    reason: "Denies, field rules and conditional rules stay read-only through TMF672 (Contracts 11.3); PATCH and DELETE are optional in TMF672 CP v5.1.0, but POST of permissionSet and of permissionSpecificationSet is mandatory, so the refusals reach mandatory operations; STD's kit payloads stay within what the projection represents. Widened on 2026-10-22 (decision 0021, decision 43). The rows are for 4D's TMF672 matrix file, which uses these IDs."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E24-tmf688-resource-topic-post
    decision0021: 24
    rows:
      - TMF688@4.0.0/CP/operations/event-post-resource-topic
    requirement: "POST of events on TMF688 resource topics"
    reason: "Those events come only from saves; `405`, a status the TMF688 swagger declares for createEvent (Contracts 12.3). Event POST, mandatory in TMF688 CP v4.0.0 p.8, is served on client topics."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E25-oda-no-dependencies
    decision0021: 25
    rows: []
    requirement: "No dependent APIs and no subscribed events in the ODA Component"
    reason: "STD masters its parties, CIs and orders in v0.1 (Contracts 13.2)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "All 33 open decisions of decision 0021 are accepted as recommended."
    date: 2026-10-22
  - id: E26-tmf621-read-only-attributes
    rows: []
    requirement: "TMF621 attributes the user guide lists as patchable that STD would keep read-only: priority, statusChangeHistory, resolutionDate, and ticketType after create"
    reason: "Proposed by the spec check (decision 0026, F621-05, F621-06). Martin rejected it: the four are writable through TMF621 PATCH (ticketType within its class), the ITIL behaviors behind them are defaults and form rules (decision 0021, decisions 34, 40 and 53); the rows it covered are pending again."
    recommendation: accept
    state: decided
    outcome: rejected
    decidedBy: Martin
    words: "tmforum always takes priority over ITIL. We can always lock down fields that tmforum wants writeable in the ui."
    date: 2026-10-22
  - id: E27-tmf-if-match-optional
    rows: []
    requirement: "`If-Match` optional on TMF API writes, although TMF630 v5.0.0 Part 1 §1.5.3 p.14 recommends ETag preconditions"
    reason: "The CTKs and TMF clients send no precondition; a stale `If-Match`, when sent, answers the version-conflict status the pinned document declares (`409` for TMF621), with the current ETag (Contracts 11.1; decision 0026, M2; amended by decision 0021, decision 55)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M2: 412 with the current ETag for a stale If-Match and 428 for a missing required one on /api/v2 and the TMF APIs; If-Match stays optional on the TMF APIs as an accepted exclusion (relayed by the coordinator)."
    date: 2026-10-22
  - id: E28-oda-component-identity
    rows: []
    requirement: "`componentMetadata.id` and `name` of the ODA Component name a published TM Forum component specification (the v1 Component CRD's field descriptions)"
    reason: "STD is a custom component; no golden specification exposes TMF621 (Contracts 13.1; decision 0026, M13, FODA-01)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M13: new exclusion, decided accepted (relayed by the coordinator)."
    date: 2026-10-22
  - id: E29-hub-registration-429
    rows: []
    requirement: "`429` on TMF hub registration, a status the pinned OpenAPI documents do not declare"
    reason: "Hub registrations are config commits and are rate-limited per user (Contracts 12.2); TMF routes otherwise answer only declared statuses (Contracts 11.1; decision 0026, M18)."
    recommendation: accept
    state: decided
    outcome: accepted
    decidedBy: Martin
    words: "M18: TMF routes answer only statuses the pinned document declares; 429 on hub registration is a recorded deviation (relayed by the coordinator)."
    date: 2026-10-22
