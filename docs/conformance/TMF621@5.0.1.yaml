    document: TMF621 Trouble Ticket Conformance Profile (TMF621B)
    version: 5.0.0
    licence: TM Forum member material (RAND); cited, never copied
    note: The cover says v5.0.0 and the published file name v5.0.1. Page numbers are the printed pages (printed p.1 is PDF page 4).
  - id: OAS
    document: TMF621-Trouble_Ticket-v5.0.1.oas.yaml
    version: 5.0.1
    licence: Apache-2.0
    location: packages/tmf/specs/TMF621-Trouble_Ticket-v5.0.1.oas.yaml (tmforum-apis/TMF621_TroubleTicket at f5b8ffb5975f523b17d8d55c25537d5d3533ecdb, SHA-256 in pins.json)
  - id: UG
    document: TMF621 Trouble Ticket API User Guide
    version: 5.0.1
    licence: TM Forum member material (RAND); cited, never copied
  - id: KIT
    document: TMF621 Conformance Test Kit tmf621-v5.0.0-ctk-1.0.1
    version: 5.0.0 ctk 1.0.1
    licence: TM Forum kit; downloaded by URL and digest in CI, never committed
kit:
  name: tmf621-v5.0.0-ctk-1.0.1
  note: >-
    kitCases are empty. The kit zip holds only README.md, run.sh, run.bat, config.json, .env and docker-compose.yaml; the test cases are a Cypress suite inside the image tmforumorg/tmf621-v5.0.0-ctk:1.0.1, so their titles are not readable without the image. Two ways to get them, both for the CTK-runner workstream: run the kit once (against STD or TM Forum's reference implementation) and read the titles from reports/index.json (mochawesome), or pull the pinned image by digest and list its spec files without running it. Either way the result is one KIT row per mandatory case with its exact title in kitCases, replacing KIT/mandatory-cases.
