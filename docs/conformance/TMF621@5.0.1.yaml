# Requirements matrix (Contracts 15) for TMF621 Trouble Ticket at the pinned
# version (packages/tmf/specs/pins.json). Rows paraphrase the conformance
# profile (TM Forum member material: cited by section and printed page, never
# copied) and the Apache-2.0 OpenAPI document (cited by JSON pointer).
spec: TMF621
version: 5.0.1
title: Trouble Ticket
sources:
  - id: CP
    document: TMF621 Trouble Ticket Conformance Profile (TMF621B)
    version: 5.0.0
    licence: TM Forum member material (RAND); cited, never copied
    note: The cover says v5.0.0 and the published file name v5.0.1. Page numbers are the printed pages (printed p.1 is PDF page 4).
  - id: OAS
    document: TMF621-Trouble_Ticket-v5.0.1.oas.yaml
    version: 5.0.1
    licence: Apache-2.0
    location: packages/tmf/specs/TMF621-Trouble_Ticket-v5.0.1.oas.yaml (tmforum-apis/TMF621_TroubleTicket at f5b8ffb5975f523b17d8d55c25537d5d3533ecdb, SHA-256 in pins.json)
  - id: UG
    document: TMF621 Trouble Ticket API User Guide
    version: 5.0.1
    licence: TM Forum member material (RAND); cited, never copied
  - id: KIT
    document: TMF621 Conformance Test Kit tmf621-v5.0.0-ctk-1.0.1
    version: 5.0.0 ctk 1.0.1
    licence: TM Forum kit; downloaded by URL and digest in CI, never committed
kit:
  name: tmf621-v5.0.0-ctk-1.0.1
  note: >-
    The kit's cases are a Cypress suite in its image (tmforumorg/tmf621-v5.0.0-ctk:1.0.1, digest in pins.json): one spec, cypress/e2e/production/ctk.cy.js, which generates 44 tests from the kit's own case list, read from a real run's reports/index.json (mochawesome) against a fixture server on 2026-10-23 (decision 0033). The kit marks no case mandatory; the 27 cases on TroubleTicket's mandatory operations (CP v5.0.0 p.6: POST, GET list and retrieve with and without fields, DELETE) are the KIT rows with kitCases below. The other 17 cases (troubleTicketSpecification POST, PATCH, GET and DELETE, optional in the profile) are not rows, but the runner passes a kit only when every test passed, so they must pass too. Titles are recorded normalized as the runner compares them (tooling/lib/ctk-report.ts): the configured base URL as {url}, each run of white space one space. The kit has no hub, listener or ticket PATCH cases. Its "Each attribute" checks compare dotted keys that are never set, so they pass whatever the server returns; STD does not count them as evidence for the attributes (the CP and OAS rows do).
rows:
  - id: TMF621@5.0.1/CP/resources/troubleTicket
    source: "TMF621 CP v5.0.0 API Mandatory Resources p.2"
    level: mandatory
    requirement: "TroubleTicket is the API's one mandatory resource; STD serves it at /tmf-api/troubleTicket/v5/troubleTicket."
    status: tested
    tests:
      - "packages/server/test/tmf621.test.ts#serves troubleTicket and troubleTicketSpecification at the pinned base path"
      - "packages/server/test/tmf621.test.ts#creates, retrieves, lists, patches and deletes a trouble ticket"
  - id: TMF621@5.0.1/CP/attributes/output-non-blank
    source: "TMF621 CP v5.0.0 General Notes on Resource Attribute Conformance p.2"
    level: mandatory
    requirement: "An attribute mandatory on output is present and non-blank in every response that has no fields selection; a mandatory array has at least one item; an indented attribute is mandatory only when its parent is present."
    status: tested
    tests:
      - "packages/server/test/tmf621.test.ts#tickets, incidents and problems created through /api/v1, the record service and the Step 2 upgrade render every mandatory attribute through TMF621"
  - id: TMF621@5.0.1/CP/attributes/at-type
    source: "TMF621 CP v5.0.0 TroubleTicket Resource Mandatory Attributes pp.2-3"
