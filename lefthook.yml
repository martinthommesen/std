pre-commit:
  jobs:
    - run: pnpm exec ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      # repos/ holds the vendored Effect and Foldkit source, with their own Oxlint configs and
      # plugins we do not install; FOLDKIT.md is Foldkit's template, kept byte-for-byte;
      # .agents/ and skills-lock.json are third-party agent skills pinned by hash;
      # deploy/oda/crds/ is the ODA Canvas's Component CRD, copied verbatim.
      exclude:
        - "repos/**"
        - "FOLDKIT.md"
        - ".claude/**"
        - ".agents/**"
        - "skills-lock.json"
        - "deploy/oda/crds/**"
      stage_fixed: true
