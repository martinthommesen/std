pre-commit:
  jobs:
    - run: pnpm exec ultracite fix {staged_files}
      # vendor/ is upstream Effect source, ignored by Oxlint and Oxfmt; a merge
      # that brings it in must not hand its files to the fixer.
      exclude:
        - "vendor/**"
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      stage_fixed: true
