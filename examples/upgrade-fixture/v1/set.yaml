# The Step 1 upgrade fixture (Contracts 8.4, plan Step 1 gate), version 1.
# Versions 2 and 3 live next to it; the upgrade tests and the runbook
# (docs/runbooks/upgrade-and-recovery.md) load them in turn.
set:
  id: 01d6f657-c4f6-47de-9d47-78a7281d98d2
  name: fx
  layer: app
  version: 1
  requires: [core]

namespaces:
  - id: e93f72f4-d801-4e89-a262-3113bca8ef73
    name: fx
    label: Fixture

tables:
  - id: 89a1d501-ec59-41be-aefc-b4dfa2b43ecc
    name: fx.item
    label: Item
    displayField: x
    fields:
      - id: 8bd6796c-93a5-4fe8-a0b2-ba630a27722f
        name: x
        label: X v1
        type: text
      - id: db1cec97-896f-4071-af4a-2a0bb2cb7c75
        name: w
        label: W v1
        type: text
      - id: 4fe2275c-f07c-47db-a9a1-88e3d1479fdb
        name: z
        label: Z v1
        type: text

roles:
  - id: 1cd6855e-fcfb-440b-a801-4aa41dab99ff
    name: reviewer
    label: Reviewer

accessRules:
  - id: 7c00d9a7-db1b-4726-bf62-aca982ae2612
    description: Reviewers read items.
    effect: allow
    roles: [reviewer]
    table: fx.item
    target: records
    actions: [read]
  - id: 2b97bff9-a239-4199-8703-06013c70c775
    description: Reviewers read every item field.
    effect: allow
    roles: [reviewer]
    table: fx.item
    target: fields
    fields: "*"
    actions: [read]
