# The helpdesk example app (plan Step 2; docs/servicenow-mapping.md),
# version 2, the current one: `docker compose up` loads it. Against
# version 1 (`../v1`) it
# - renames the field `assigned_to` to `assignee` (by ID: layouts, saved
#   filters and access rules name it by ID and keep working),
# - adds the status `canceled`, also to the incident's status subset, and
#   excludes it from the "open" saved filters `unassigned` and
#   `critical_open` (`my_open` lists the open statuses, so it already does),
# - relabels the statuses `in_progress` ("Work in progress") and `on_hold`
#   ("Waiting on caller"),
# - adds the field `resolution_notes` and shows it on the incident form,
#   and adds `impact` to the incident list,
# - relabels the role `agent`, and hides a ticket's customer email from
#   agents unless the ticket is theirs (a new access rule).
#
# Load it with
#   pnpm std upgrade --set examples/helpdesk/v2
set:
  id: 8405d65d-4573-43cb-931c-e59fee0557a0
  name: helpdesk
  layer: app
  version: 2
  requires: [core]

namespaces:
  - id: e1e5c743-5a04-482a-870c-32b348fbb0a8
    name: helpdesk
    label: Helpdesk

roles:
  - id: a07fb4d5-0d16-4837-80a4-60582b7210ff
    name: agent
    label: Helpdesk agent
    helpText: Works tickets and incidents; never sees internal costs.
