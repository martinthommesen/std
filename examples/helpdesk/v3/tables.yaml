        type: boolean
        default: false
      - id: 57816def-a484-5c9e-b314-2c37053327b3
        name: parent_incident
        type:
          kind: reference
          target: helpdesk.incident
      - id: 9ab746a9-2006-53ab-91d8-ab351c2798af
        name: problem
        type:
          kind: reference
          target: helpdesk.problem
    overrides:
      - id: 131e87a1-946d-49f4-b438-1bbbdf651716
        field: number
        numberPrefix: INC
      - id: 8765fcbb-7b9b-4a37-b925-6b3f24997024
        field: status
        choices:
          - new
          - in_progress
          - on_hold
          - resolved
          - closed
          - canceled
    layouts:
      - id: 6fc95feb-9d04-4485-9435-36ab2691cf82
        type: form
        elements:
          - section: Incident
          - field: number
          - field: short_description
          - field: description
          - field: status
          - field: impact
          - field: urgency
          - field: priority
          - field: major_incident
          - field: assigned_to
          - field: caller
          - field: parent_incident
          - field: problem
          - field: hold_reason
          - field: resolution_code
          - field: resolution_notes
          - field: resolved_at
      - id: b0538214-492c-4970-a437-ca18fd68d942
        type: list
        elements:
          - field: number
          - field: short_description
          - field: category
          - field: impact
          - field: urgency
          - field: priority
          - field: status
          - field: assigned_to
    savedFilters:
      - id: cc8af5be-f3a8-404a-be7c-d00b951c0d42
        name: my_open
        label: My open incidents
        condition:
          op: and
          args:
            - op: eq
              left:
                path:
                  - fc99eecb-5682-4a6c-8391-60d1055c4b2e
              right:
                ctx: me
            - op: in
              left:
                path:
                  - 4f51d80d-0886-4184-a8bb-5b5f7eefa4d2
              right:
                - value: new
                - value: in_progress
                - value: on_hold
      - id: ccf72b42-f1a6-477f-93a4-818aa78182f4
        name: unassigned
        label: Unassigned and open
        condition:
          op: and
          args:
            - op: empty
              arg:
                path:
                  - fc99eecb-5682-4a6c-8391-60d1055c4b2e
            - op: notIn
              left:
                path:
                  - 4f51d80d-0886-4184-a8bb-5b5f7eefa4d2
              right:
                - value: resolved
                - value: closed
                - value: canceled
      - id: 5f7a4a5a-5032-4888-9ba8-834cf4448d8c
        name: critical_open
        label: Critical and open
        condition:
          op: and
          args:
            - op: eq
              left:
                path:
                  - 222508c2-9257-41db-a243-151441078982
              right:
                value: "1"
            - op: notIn
              left:
                path:
                  - 4f51d80d-0886-4184-a8bb-5b5f7eefa4d2
              right:
                - value: resolved
                - value: closed
                - value: canceled
      - id: b78ab936-4a4d-5d2f-8034-65b762757e06
        name: open_major
        label: Open major incidents
        condition:
          op: and
          args:
            - op: eq
              left:
                path:
                  - 6b1bd403-01ff-57a5-8746-990c9050fc0c
              right:
                value: true
            - op: in
              left:
                path:
                  - 4f51d80d-0886-4184-a8bb-5b5f7eefa4d2
              right:
                - value: new
                - value: in_progress
                - value: on_hold
      - id: 6ba157bc-568a-5831-a415-9997a7dfd4c1
        name: major_not_priority_one
        label: Major incidents not at priority 1
        condition:
          op: and
          args:
            - op: eq
              left:
                path:
                  - 6b1bd403-01ff-57a5-8746-990c9050fc0c
              right:
                value: true
            - op: not
              arg:
                op: eq
                left:
                  path:
                    - 222508c2-9257-41db-a243-151441078982
                right:
                  value: "1"
