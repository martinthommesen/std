      - id: 3524c6b1-fcf0-48de-8b11-388aef14ab6a
        name: costly
        label: Costly tickets
        condition:
          op: gt
          left:
            path:
              - d26946db-e483-4f22-a4af-1ffcb0488ba9
          right:
            value: "500.00"
  - id: 91446a86-8028-4d34-a501-b7cf0f59fdd5
