            label: Phone
          - id: ca269aa2-8720-58c6-affc-ebf67116f92f
            key: web
            label: Web
          - id: 50a39d24-b807-5b92-a355-d9c150934213
            key: monitoring
            label: Monitoring
          - id: 1e3d0b51-a23a-552d-9407-7fcc49388f55
            key: other
