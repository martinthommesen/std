            label: 3 - Moderate
            hidden: true
          - id: b77c3a1e-e98d-4bb6-aab5-a01f86e622fc
            key: low
            label: 4 - Low
            hidden: true
          - id: 6565dd18-b7a7-54da-844f-e19e7cf3662e
            key: "1"
            label: 1 - Critical
          - id: 03ee8c35-fa88-570b-81fc-12615baa95bd
