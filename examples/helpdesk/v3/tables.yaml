            label: Awaiting caller
          - id: eb5fce3d-614e-5220-b55a-fd43639b71d9
            key: awaiting_change
            label: Awaiting change
          - id: 10df8654-8c9d-5377-ad8d-84d8d15c8a43
            key: awaiting_problem
            label: Awaiting problem
          - id: 4200f5f2-8f67-5bd6-bb6b-0f5d9bde2f58
            key: awaiting_vendor
            label: Awaiting vendor
      - id: b93e6de9-38f4-5ac9-b2f5-207586073d98
